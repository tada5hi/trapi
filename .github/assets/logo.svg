<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="trapi-a-title trapi-a-desc">
<title id="trapi-a-title">TRAPI — Source to specification</title>
<desc id="trapi-a-desc">A decorated source sheet passes through an aperture and becomes an OpenAPI document.</desc>
<style>
:root{--accent:#6366d8;--second:#159cb2;--ink:#253447;--paper:#f7fafc;--line:#8394a7;--wash:#6366d818}
@media(prefers-color-scheme:dark){:root{--ink:#e4ebf3;--paper:#182332;--line:#8495aa;--wash:#6366d822}}
.a{stroke:var(--accent)}.b{stroke:var(--second)}.af{fill:var(--accent)}.bf{fill:var(--second)}.ink{fill:var(--ink)}.paper{stroke:var(--line)}.line{stroke:var(--line)}.wash{fill:var(--wash)}.white{fill:#fff}.neutral{fill:var(--paper)}
</style>
