<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="tr-voc-title tr-voc-desc">
<title id="tr-voc-title">Two decorator vocabularies, one Metadata</title>
<desc id="tr-voc-desc">The same route is written twice. With @decorators/express names: @Controller('/users'), @Get('/:id'), @Params('id') and @Query('expand'), read by @trapi/preset-decorators-express. With typescript-rest names: @Path('/users') on the class, @GET plus @Path('/:id') on the method, @PathParam('id') and @QueryParam('expand'), read by @trapi/preset-typescript-rest. Both produce identical controllers: paths ['users'], method 'get' at path ':id', a path parameter id and a queryProp parameter expand. Controller maps to Path on a class and sets paths; Get maps to GET plus Path on a method and sets verb and path; Params maps to PathParam and sets in: 'path'; Query maps to QueryParam and sets in: 'queryProp'.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="tr-voc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="474" rx="22"/>
<text class="h" x="30" y="44">A preset maps your decorator names: two vocabularies, one Metadata</text>

<rect class="sunk" x="28" y="64" width="420" height="166" rx="13"/>
<text class="l" x="46" y="88">@decorators/express · preset-decorators-express</text>
<text class="c" x="46" y="116"><tspan class="ta">@Controller</tspan>('/users')</text>
<text class="c" x="46" y="138">export class UserController {</text>
<text class="c" x="62" y="160"><tspan class="ta">@Get</tspan>('/:id')</text>
<text class="c" x="62" y="182">findOne(<tspan class="ta">@Params</tspan>('id') id: string,</text>
<text class="c" x="126" y="204"><tspan class="ta">@Query</tspan>('expand') expand?: string)</text>

<rect class="sunk" x="28" y="246" width="420" height="166" rx="13"/>
<text class="l" x="46" y="270">typescript-rest · preset-typescript-rest</text>
<text class="c" x="46" y="298"><tspan class="ta">@Path</tspan>('/users')</text>
<text class="c" x="46" y="320">export class UserController {</text>
<text class="c" x="62" y="342"><tspan class="ta">@GET</tspan> <tspan class="ta">@Path</tspan>('/:id')</text>
<text class="c" x="62" y="364">findOne(<tspan class="ta">@PathParam</tspan>('id') id: string,</text>
<text class="c" x="126" y="386"><tspan class="ta">@QueryParam</tspan>('expand') expand?: string)</text>

<path class="rail" d="M450 147 H482" marker-end="url(#tr-voc-arrow)"/>
<path class="rail" d="M450 329 H468 V182 H482" marker-end="url(#tr-voc-arrow)"/>

<rect class="card" x="488" y="64" width="444" height="166" rx="13"/><rect class="ks" x="488" y="78" width="4" height="138" rx="2"/>
<text class="t" x="506" y="92">Metadata</text><text class="s" x="584" y="92">identical for both sources</text>
<text class="c" x="506" y="120">paths: ['users']</text>
<text class="c" x="506" y="142">methods[0]: { method: 'get', path: ':id' }</text>
<text class="c" x="522" y="164">{ in: 'path', name: 'id' }</text>
<text class="c" x="522" y="186">{ in: 'queryProp', name: 'expand' }</text>
<text class="c" x="506" y="208">type: refAlias 'User'</text>

<rect class="card" x="488" y="246" width="444" height="166" rx="13"/><rect class="ka" x="488" y="260" width="4" height="138" rx="2"/>
<text class="l" x="506" y="270">express</text><text class="l" x="628" y="270">typescript-rest</text><text class="l" x="790" y="270">sets</text>
<text class="c" x="506" y="298">Controller</text><text class="c" x="628" y="298">Path (class)</text><text class="c ts" x="790" y="298">paths</text>
<text class="c" x="506" y="324">Get</text><text class="c" x="628" y="324">GET + Path</text><text class="c ts" x="790" y="324">verb, path</text>
<text class="c" x="506" y="350">Params</text><text class="c" x="628" y="350">PathParam</text><text class="c ts" x="790" y="350">in: 'path'</text>
<text class="c" x="506" y="376">Query</text><text class="c" x="628" y="376">QueryParam</text><text class="c ts" x="790" y="376">in: 'queryProp'</text>
<text class="s" x="506" y="400">handler match names, one row per mapping</text>

<rect class="sunk dash" x="28" y="428" width="904" height="46" rx="13"/>
<text class="s" x="46" y="456">The presets are self-contained and neither extends the other; a decorator that no handler matches contributes nothing.</text>
</svg>
