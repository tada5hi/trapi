<svg xmlns="http://www.w3.org/2000/svg" width="960" height="516" viewBox="0 0 960 516" role="img" aria-labelledby="tr-um-title tr-um-desc">
<title id="tr-um-title">What happens to a decorator no handler matches</title>
<desc id="tr-um-desc">findOne carries @Get('/:id'), which the preset matches, and @Audit('read'), which no handler matches. The collected report is { name: 'Audit', target: 'method', host: { name: 'findOne', parentName: 'UserController' }, file, line: 7 }. With strict unset or false the decorator is ignored silently. strict: true prints one console.warn listing "- @Audit on method 'findOne' (user.controller.ts:7)". strict: 'throw' throws a GeneratorError with code GENERATOR_STRICT_UNMATCHED_DECORATORS. onUnmatchedDecorator receives the array of reports instead, with no warning and no throw. Reporting bypasses the metadata cache; JSDoc tags are not reported.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="tr-um-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="500" rx="22"/>
<text class="h" x="30" y="44">Unmatched decorators: ignored, reported, thrown or handed to you</text>

<rect class="sunk" x="28" y="64" width="390" height="158" rx="13"/>
<text class="l" x="46" y="88">src/controllers/user.controller.ts</text>
<text class="c" x="46" y="116"><tspan class="ta">@Controller</tspan>('/users')</text>
<text class="c" x="46" y="138">export class UserController {</text>
<text class="c" x="62" y="160"><tspan class="ta">@Get</tspan>('/:id')</text>
<text class="c" x="62" y="182"><tspan class="tw">@Audit</tspan>('read')</text>
<text class="c" x="62" y="204">findOne(<tspan class="ta">@Params</tspan>('id') id: string)</text>

<path class="rail dash" d="M420 143 H446" marker-end="url(#tr-um-arrow)"/>

<rect class="card" x="452" y="64" width="480" height="158" rx="13"/><rect class="kw" x="452" y="78" width="4" height="130" rx="2"/>
<text class="t" x="470" y="92">UnmatchedDecoratorReport</text>
<text class="c" x="470" y="122">{ name: 'Audit', target: 'method',</text>
<text class="c" x="486" y="144">host: { name: 'findOne',</text>
<text class="c" x="550" y="166">parentName: 'UserController' },</text>
<text class="c" x="486" y="188">file: '…/user.controller.ts', line: 7 }</text>
<text class="s" x="470" y="210">collected at the end of generateMetadata()</text>

<rect class="card" x="28" y="238" width="904" height="44" rx="13"/>
<text class="c" x="46" y="265">strict: false</text><text class="s" x="160" y="265">(default)</text>
<rect class="ww" x="290" y="247" width="124" height="26" rx="13"/><text class="tw" x="352" y="265" text-anchor="middle" font-size="12" font-weight="600">ignored</text>
<text class="s" x="432" y="265">no report, no warning; @Audit contributes nothing</text>

<rect class="card" x="28" y="290" width="904" height="44" rx="13"/>
<text class="c" x="46" y="317">strict: true</text>
<rect class="ww" x="290" y="299" width="124" height="26" rx="13"/><text class="tw" x="352" y="317" text-anchor="middle" font-size="12" font-weight="600">console.warn</text>
<text class="c" x="432" y="317">- @Audit on method 'findOne' (…/user.controller.ts:7)</text>

<rect class="card" x="28" y="342" width="904" height="44" rx="13"/>
<text class="c" x="46" y="369">strict: 'throw'</text>
<rect class="wd" x="290" y="351" width="124" height="26" rx="13"/><text class="td" x="352" y="369" text-anchor="middle" font-size="12" font-weight="600">GeneratorError</text>
<text class="c" x="432" y="369">code: 'GENERATOR_STRICT_UNMATCHED_DECORATORS'</text>

<rect class="card" x="28" y="394" width="904" height="44" rx="13"/>
<text class="c" x="46" y="421">onUnmatchedDecorator</text>
<rect class="wo" x="290" y="403" width="124" height="26" rx="13"/><text class="to" x="352" y="421" text-anchor="middle" font-size="12" font-weight="600">your callback</text>
<text class="s" x="432" y="421">receives the reports array; replaces the warning and the throw</text>

<rect class="sunk dash" x="28" y="454" width="904" height="46" rx="13"/>
<text class="s" x="46" y="482">Reporting bypasses the metadata cache, so handler dispatch always runs; JSDoc tags are never reported.</text>
</svg>
