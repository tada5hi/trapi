<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="cli-cfg-title cli-cfg-desc">
<title id="cli-cfg-title">Where trapi generate finds its configuration</title>
<desc id="cli-cfg-desc">The first step that applies wins: --noConfig skips configuration, --config loads that file and fails with exit code 1 when it is missing, otherwise the first trapi.config file with extension ts, mts, cts, mjs, cjs, js or json in the working directory, otherwise the trapi field of package.json in that directory, otherwise the flags alone form one entry. The file default export is unwrapped and may be one entry or an array of entries.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
.tm{fill:var(--muted)}
</style>
<defs><marker id="cli-cfg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="504" rx="22"/>
<text class="h" x="30" y="44">Where trapi generate finds its configuration</text>
<rect class="card" x="28" y="70" width="444" height="62" rx="13"/><rect class="ka" x="28" y="84" width="4" height="34" rx="2"/>
<text class="l" x="46" y="96">1</text>
<text class="c" x="66" y="96">--noConfig</text>
<text class="s" x="66" y="118">skip discovery: flags only</text>
<path class="rail dash" d="M250 133 V146" marker-end="url(#cli-cfg-arrow)"/>
<rect class="card" x="28" y="148" width="444" height="62" rx="13"/><rect class="ka" x="28" y="162" width="4" height="34" rx="2"/>
<text class="l" x="46" y="174">2</text>
<text class="c" x="66" y="174">--config build/trapi.config.ts</text>
<text class="s" x="66" y="196">load that file; missing: exit 1</text>
<path class="rail dash" d="M250 211 V224" marker-end="url(#cli-cfg-arrow)"/>
<rect class="card" x="28" y="226" width="444" height="62" rx="13"/><rect class="ka" x="28" y="240" width="4" height="34" rx="2"/>
<text class="l" x="46" y="252">3</text>
<text class="c" x="66" y="252">trapi.config.{ts,mts,cts,mjs,cjs,js,json}</text>
<text class="s" x="66" y="274">first match in the working directory</text>
<path class="rail dash" d="M250 289 V302" marker-end="url(#cli-cfg-arrow)"/>
<rect class="card" x="28" y="304" width="444" height="62" rx="13"/><rect class="ka" x="28" y="318" width="4" height="34" rx="2"/>
<text class="l" x="46" y="330">4</text>
<text class="c" x="66" y="330">package.json  "trapi": { … }</text>
<text class="s" x="66" y="352">the field, in the working directory</text>
<path class="rail dash" d="M250 367 V380" marker-end="url(#cli-cfg-arrow)"/>
<rect class="card" x="28" y="382" width="444" height="62" rx="13"/><rect class="kw" x="28" y="396" width="4" height="34" rx="2"/>
<text class="l" x="46" y="408">5</text>
<text class="c" x="66" y="408">nothing found</text>
<text class="s" x="66" y="430">one empty entry: flags only</text>
<rect class="sunk" x="500" y="70" width="432" height="302" rx="13"/>
<text class="l" x="518" y="94">trapi.config.ts</text>
<text class="c" x="518" y="122">import { defineConfig } from '@trapi/cli';</text>
<text class="c" x="518" y="144"></text>
<text class="c" x="518" y="166"><tspan class="ta">export default</tspan> defineConfig({</text>
<text class="c" x="534" y="188">metadata: {</text>
<text class="c" x="550" y="210">entryPoint: 'src/controllers/**/*.ts',</text>
<text class="c" x="550" y="232">preset: '@trapi/preset-decorators-express',</text>
<text class="c" x="534" y="254">},</text>
<text class="c" x="534" y="276">swagger: { version: 'v3.2' },</text>
<text class="c" x="534" y="298">output: { path: 'docs/openapi.json' },</text>
<text class="c" x="518" y="320">});</text>
<rect class="ws" x="518" y="334" width="190" height="24" rx="12"/><text class="ts" x="613" y="350.5" text-anchor="middle" font-size="12" font-weight="600">default export unwrapped</text>
<rect class="ws" x="718" y="334" width="160" height="24" rx="12"/><text class="ts" x="798" y="350.5" text-anchor="middle" font-size="12" font-weight="600">array = multi-target</text>
<rect class="ww" x="500" y="392" width="392" height="24" rx="12"/><text class="tw" x="696" y="408.5" text-anchor="middle" font-size="12" font-weight="600">output.path resolves against the config directory</text>
<rect class="sunk dash" x="28" y="456" width="904" height="46" rx="13"/>
<text class="s" x="46" y="484">entryPoint globs and a tsconfig path resolve against process.cwd(), not against --cwd or the config directory.</text>
</svg>
