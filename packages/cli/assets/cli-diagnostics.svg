<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="cli-diag-title cli-diag-desc">
<title id="cli-diag-title">trapi info and trapi cache clean</title>
<desc id="cli-diag-desc">trapi info prints the CLI version, the Node.js version, platform and working directory, the config file and its number of entries, and the installed versions of @trapi/core, @trapi/metadata, @trapi/swagger and typescript. trapi cache clean --max-age 604800000 deletes .trapi-metadata-*.json files older than seven days, keeps newer ones and never touches other files.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
.tm{fill:var(--muted)}
</style>
<defs><marker id="cli-diag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="504" rx="22"/>
<text class="h" x="30" y="44">trapi info and trapi cache clean</text>
<rect class="sunk" x="28" y="70" width="430" height="374" rx="13"/>
<text class="l" x="46" y="94">$ trapi info</text>
<text class="c" x="46" y="124"><tspan class="ts">ℹ</tspan> trapi v2.2.0</text>
<text class="c ta" x="46" y="152" font-weight="600">Environment</text>
<text class="c tm" x="64" y="174">node</text><text class="c" x="162" y="174">v26.13.0</text>
<text class="c tm" x="64" y="196">platform</text><text class="c" x="162" y="196">darwin arm64</text>
<text class="c tm" x="64" y="218">cwd</text><text class="c" x="162" y="218">/path/to/project</text>
<text class="c ta" x="46" y="246" font-weight="600">Config</text>
<text class="c tm" x="64" y="268">file</text><text class="c" x="162" y="268">…/trapi.config.ts</text>
<text class="c tm" x="64" y="290">entries</text><text class="c" x="162" y="290">2</text>
<text class="c ta" x="46" y="318" font-weight="600">Dependencies</text>
<text class="c tm" x="64" y="340">@trapi/core</text><text class="c" x="202" y="340">2.2.0</text>
<text class="c tm" x="64" y="362">@trapi/metadata</text><text class="c" x="202" y="362">2.2.0</text>
<text class="c tm" x="64" y="384">@trapi/swagger</text><text class="c" x="202" y="384">2.2.0</text>
<text class="c tm" x="64" y="406">typescript</text><text class="c" x="202" y="406">6.0.3</text>
<rect class="sunk" x="486" y="70" width="446" height="128" rx="13"/>
<text class="l" x="504" y="94">$ trapi cache clean</text>
<text class="c" x="504" y="122">--directory .trapi-cache --max-age 604800000</text>
<text class="c" x="504" y="144"><tspan class="to">✔</tspan> removed 1 cache file(s) from</text>
<text class="c" x="520" y="166">…/.trapi-cache (1 retained)</text>
<rect class="card" x="486" y="214" width="446" height="66" rx="13"/><rect class="kd" x="486" y="228" width="4" height="38" rx="2"/>
<text class="c" x="504" y="242">.trapi-metadata-aaa.json</text>
<text class="s" x="504" y="264">older than 7 days</text>
<rect class="wd" x="824" y="235" width="92" height="24" rx="12"/><text class="td" x="870" y="251.5" text-anchor="middle" font-size="12" font-weight="600">removed</text>
<rect class="card" x="486" y="290" width="446" height="66" rx="13"/><rect class="ko" x="486" y="304" width="4" height="38" rx="2"/>
<text class="c" x="504" y="318">.trapi-metadata-bbb.json</text>
<text class="s" x="504" y="340">modified today</text>
<rect class="wo" x="824" y="311" width="92" height="24" rx="12"/><text class="to" x="870" y="327.5" text-anchor="middle" font-size="12" font-weight="600">retained</text>
<rect class="card" x="486" y="366" width="446" height="66" rx="13"/><rect class="kw" x="486" y="380" width="4" height="38" rx="2"/>
<text class="c" x="504" y="394">notes.json</text>
<text class="s" x="504" y="416">not a cache file</text>
<rect class="ww" x="824" y="387" width="92" height="24" rx="12"/><text class="tw" x="870" y="403.5" text-anchor="middle" font-size="12" font-weight="600">ignored</text>
<rect class="sunk dash" x="28" y="460" width="904" height="46" rx="13"/>
<text class="s" x="46" y="488">cache clean does not read trapi.config: pass --directory when metadata.cache stores files elsewhere.</text>
</svg>
