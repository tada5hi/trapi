<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="cli-exit-title cli-exit-desc">
<title id="cli-exit-title">How trapi exits</title>
<desc id="cli-exit-desc">Exit code 0 when every target was written, when info or cache clean finished, or when watch was stopped. Exit code 1 for a CLIUserError, printed as a bare message: an unknown version, no entryPoint, a missing --config file, a bad --strict or --max-age value, a transform returning a non-object, or an unknown subcommand. Exit code 2 for any other error, printed with its stack: GeneratorError from strict throw, an Error thrown in a transform.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
.tm{fill:var(--muted)}
</style>
<defs><marker id="cli-exit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="414" rx="22"/>
<text class="h" x="30" y="44">How trapi exits</text>
<rect class="card" x="28" y="70" width="280" height="268" rx="13"/><rect class="ko" x="28" y="84" width="4" height="240" rx="2"/>
<rect class="wo" x="46" y="86" width="72" height="24" rx="12"/><text class="c to" x="82" y="102.5" text-anchor="middle" font-size="11" font-weight="600">exit 0</text>
<text class="t" x="46" y="136" font-size="15">success</text>
<text class="s" x="46" y="166">every target written</text>
<text class="s" x="46" y="188">info, cache clean finished</text>
<text class="s" x="46" y="210">watch stopped with Ctrl+C</text>
<rect class="card" x="334" y="70" width="318" height="268" rx="13"/><rect class="kw" x="334" y="84" width="4" height="240" rx="2"/>
<rect class="ww" x="352" y="86" width="72" height="24" rx="12"/><text class="c tw" x="388" y="102.5" text-anchor="middle" font-size="11" font-weight="600">exit 1</text>
<text class="t" x="352" y="136" font-size="15">CLIUserError: message only</text>
<text class="c" x="352" y="166">Unknown OpenAPI version "4".</text>
<text class="c" x="352" y="188">No `entryPoint` provided.</text>
<text class="c" x="352" y="210">Config file not found: …</text>
<text class="c" x="352" y="232">Unknown --strict value "maybe".</text>
<text class="c" x="352" y="254">Invalid --max-age "-5".</text>
<text class="c" x="352" y="276">`swagger.transform` must …</text>
<text class="s" x="352" y="298">citty: unknown subcommand</text>
<rect class="card" x="678" y="70" width="254" height="268" rx="13"/><rect class="kd" x="678" y="84" width="4" height="240" rx="2"/>
<rect class="wd" x="696" y="86" width="72" height="24" rx="12"/><text class="c td" x="732" y="102.5" text-anchor="middle" font-size="11" font-weight="600">exit 2</text>
<text class="t" x="696" y="136" font-size="15">other error: with stack</text>
<text class="c" x="696" y="166">GeneratorError:</text>
<text class="c" x="708" y="188">[trapi] strict mode: …</text>
<text class="s" x="696" y="210">(--strict throw)</text>
<text class="c" x="696" y="232">Error: missing /users</text>
<text class="s" x="696" y="254">(thrown in a transform)</text>
<text class="s" x="696" y="276">any other metadata or</text>
<text class="s" x="696" y="298">swagger error</text>
<rect class="sunk dash" x="28" y="356" width="904" height="46" rx="13"/>
<text class="s" x="46" y="384">Every command wraps its work in runWithExitCode; generate stops at the first failing target.</text>
</svg>
