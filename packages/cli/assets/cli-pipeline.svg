<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="cli-pipe-title cli-pipe-desc">
<title id="cli-pipe-title">trapi generate: one command, the whole pipeline</title>
<desc id="cli-pipe-desc">trapi generate loads trapi.config.ts (or the trapi field in package.json, or nothing), resolves every entry against the CLI flags, runs generateMetadata once per distinct metadata signature, then for each entry runs generateSwagger, the optional swagger.transform and saveSwagger. For a two-entry config the debug log shows one extraction and two written files, openapi.v3.2.json and openapi.v2.yaml.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
.tm{fill:var(--muted)}
</style>
<defs><marker id="cli-pipe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="464" rx="22"/>
<text class="h" x="30" y="44">trapi generate: one command, the whole pipeline</text>
<rect class="card" x="28" y="70" width="202" height="104" rx="13"/><rect class="ka" x="28" y="84" width="4" height="76" rx="2"/>
<text class="t" x="46" y="100">loadConfig</text>
<text class="c s" x="46" y="126">trapi.config.ts</text>
<text class="s" x="46" y="148">entries: 1 or more</text>
<rect class="card" x="262" y="70" width="202" height="104" rx="13"/><rect class="ka" x="262" y="84" width="4" height="76" rx="2"/>
<text class="t" x="280" y="100">resolveEntry</text>
<text class="s" x="280" y="126">CLI flags override config,</text>
<text class="s" x="280" y="148">config overrides defaults</text>
<rect class="card" x="496" y="70" width="202" height="104" rx="13"/><rect class="ks" x="496" y="84" width="4" height="76" rx="2"/>
<text class="t" x="514" y="100">generateMetadata</text>
<text class="s" x="514" y="126">once per distinct</text>
<text class="s" x="514" y="148">metadata signature</text>
<rect class="card" x="730" y="70" width="202" height="104" rx="13"/><rect class="ks" x="730" y="84" width="4" height="76" rx="2"/>
<text class="t" x="748" y="100">generateSwagger</text>
<text class="s" x="748" y="126">once per entry</text>
<text class="c s" x="748" y="148">version: 'v3.2' | 'v2'</text>
<path class="rail" d="M232 122 H260" marker-end="url(#cli-pipe-arrow)"/>
<path class="rail" d="M466 122 H494" marker-end="url(#cli-pipe-arrow)"/>
<path class="rail" d="M700 122 H728" marker-end="url(#cli-pipe-arrow)"/>
<path class="rail" d="M831 176 V196 H129 V214" marker-end="url(#cli-pipe-arrow)"/>
<rect class="card" x="28" y="216" width="202" height="104" rx="13"/><rect class="ka" x="28" y="230" width="4" height="76" rx="2"/>
<text class="t" x="46" y="246">swagger.transform</text>
<text class="s" x="46" y="272">optional, per entry</text>
<text class="s" x="46" y="294">edits or replaces spec</text>
<rect class="card" x="262" y="216" width="202" height="104" rx="13"/><rect class="ks" x="262" y="230" width="4" height="76" rx="2"/>
<text class="t" x="280" y="246">saveSwagger</text>
<text class="c s" x="280" y="272">openapi.v3.2.json</text>
<text class="c s" x="280" y="294">openapi.v2.yaml</text>
<path class="rail" d="M232 268 H260" marker-end="url(#cli-pipe-arrow)"/>
<rect class="ww" x="54" y="336" width="150" height="24" rx="12"/><text class="tw" x="129" y="352.5" text-anchor="middle" font-size="12" font-weight="600">skipped when unset</text>
<rect class="sunk" x="496" y="216" width="436" height="180" rx="13"/>
<text class="l" x="514" y="240">trapi generate --log-level debug</text>
<text class="c tm" x="514" y="268">› loaded config from …/trapi.config.ts</text>
<text class="c tm" x="514" y="290">› resolved 2 target(s)</text>
<text class="c tm" x="514" y="312">› metadata: 1 controller(s), 1 reference type(s)</text>
<text class="c" x="514" y="334"><tspan class="ts">ℹ</tspan> wrote …/dist/openapi.v3.2.json (v3.2)</text>
<text class="c" x="514" y="356"><tspan class="ts">ℹ</tspan> wrote …/dist/openapi.v2.yaml (v2)</text>
<text class="c" x="514" y="378"><tspan class="to">✔</tspan> done in 156ms</text>
<rect class="sunk dash" x="28" y="414" width="904" height="46" rx="13"/>
<text class="s" x="46" y="442">Targets are emitted and written in config order. With no config file the flags alone form one entry.</text>
</svg>
