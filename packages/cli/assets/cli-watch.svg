<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="cli-watch-title cli-watch-desc">
<title id="cli-watch-title">trapi watch: what is watched and what re-runs</title>
<desc id="cli-watch-desc">trapi watch resolves the targets once and watches the static prefix of each entryPoint glob, for example src/controllers for src/controllers/**/*.ts, plus the directory of the config file. node_modules, .git, dist, build, coverage and the files written by the last run are ignored. A change is debounced for 200 ms, then the full generate run repeats, re-reading the config. A change during a run queues one more run. Errors are logged and watching continues.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
.tm{fill:var(--muted)}
</style>
<defs><marker id="cli-watch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="504" rx="22"/>
<text class="h" x="30" y="44">trapi watch: what is watched and what re-runs</text>
<rect class="card" x="28" y="70" width="444" height="136" rx="13"/><rect class="ka" x="28" y="84" width="4" height="108" rx="2"/>
<text class="t" x="46" y="100">watch roots</text>
<text class="c" x="46" y="126">'src/controllers/**/*.ts'</text>
<text class="c" x="46" y="148"><tspan class="tm">→</tspan> <tspan class="ts">&lt;cwd&gt;/src/controllers</tspan></text>
<text class="c" x="46" y="170">trapi.config.ts <tspan class="tm">→</tspan> <tspan class="ts">its directory</tspan></text>
<rect class="card" x="500" y="70" width="432" height="136" rx="13"/><rect class="kw" x="500" y="84" width="4" height="108" rx="2"/>
<text class="t" x="518" y="100">ignored</text>
<rect class="ww" x="518" y="112" width="108" height="24" rx="12"/><text class="c tw" x="572" y="128.5" text-anchor="middle" font-size="11" font-weight="600">node_modules</text>
<rect class="ww" x="634" y="112" width="52" height="24" rx="12"/><text class="c tw" x="660" y="128.5" text-anchor="middle" font-size="11" font-weight="600">.git</text>
<rect class="ww" x="694" y="112" width="52" height="24" rx="12"/><text class="c tw" x="720" y="128.5" text-anchor="middle" font-size="11" font-weight="600">dist</text>
<rect class="ww" x="754" y="112" width="60" height="24" rx="12"/><text class="c tw" x="784" y="128.5" text-anchor="middle" font-size="11" font-weight="600">build</text>
<rect class="ww" x="822" y="112" width="84" height="24" rx="12"/><text class="c tw" x="864" y="128.5" text-anchor="middle" font-size="11" font-weight="600">coverage</text>
<rect class="ww" x="518" y="148" width="300" height="24" rx="12"/><text class="tw" x="668" y="164.5" text-anchor="middle" font-size="12" font-weight="600">files written by the last run</text>
<rect class="card" x="28" y="236" width="202" height="104" rx="13"/><rect class="ka" x="28" y="250" width="4" height="76" rx="2"/>
<text class="t" x="46" y="266">file event</text>
<text class="s" x="46" y="292">add, change, unlink</text>
<text class="s" x="46" y="314">after writes settle</text>
<rect class="card" x="262" y="236" width="202" height="104" rx="13"/><rect class="ka" x="262" y="250" width="4" height="76" rx="2"/>
<text class="t" x="280" y="266">debounce</text>
<text class="c s" x="280" y="292">200 ms</text>
<text class="s" x="280" y="314">after the last event</text>
<rect class="card" x="496" y="236" width="202" height="104" rx="13"/><rect class="ks" x="496" y="250" width="4" height="76" rx="2"/>
<text class="t" x="514" y="266">runGenerate</text>
<text class="s" x="514" y="292">config re-read,</text>
<text class="s" x="514" y="314">full extraction</text>
<rect class="card" x="730" y="236" width="202" height="104" rx="13"/><rect class="ks" x="730" y="250" width="4" height="76" rx="2"/>
<text class="t" x="748" y="266">files written</text>
<text class="s" x="748" y="292">added to the ignore</text>
<text class="s" x="748" y="314">list for next run</text>
<path class="rail" d="M232 288 H260" marker-end="url(#cli-watch-arrow)"/>
<path class="rail" d="M466 288 H494" marker-end="url(#cli-watch-arrow)"/>
<path class="rail" d="M700 288 H728" marker-end="url(#cli-watch-arrow)"/>
<path class="rail dash" d="M597 342 V362 H129 V344" marker-end="url(#cli-watch-arrow)"/>
<rect class="wa" x="213" y="374" width="300" height="24" rx="12"/><text class="ta" x="363" y="390.5" text-anchor="middle" font-size="12" font-weight="600">change during a run: one queued re-run</text>
<rect class="wo" x="706" y="360" width="220" height="24" rx="12"/><text class="to" x="816" y="376.5" text-anchor="middle" font-size="12" font-weight="600">success: keep watching</text>
<rect class="wd" x="706" y="394" width="220" height="24" rx="12"/><text class="td" x="816" y="410.5" text-anchor="middle" font-size="12" font-weight="600">error: logged, keep watching</text>
<rect class="sunk dash" x="28" y="456" width="904" height="46" rx="13"/>
<text class="s" x="46" y="484">Roots are computed once at startup. Ctrl+C (SIGINT, SIGTERM) closes the watcher and exits with code 0.</text>
</svg>
