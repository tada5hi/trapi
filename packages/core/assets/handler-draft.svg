<svg xmlns="http://www.w3.org/2000/svg" width="960" height="448" viewBox="0 0 960 448" role="img" aria-labelledby="core-hd-title core-hd-desc">
<title id="core-hd-title">Handlers match decorators and mutate drafts</title>
<desc id="core-hd-desc">A controller class carries @Controller('/users'), a method with @Get('/:id') and @Audit(), and a parameter with @Path('id'). The preset's controller handler matches Controller and sets paths ['/users'] on the ControllerDraft, the method handler matches Get and sets verb 'get' and path '/:id' on the MethodDraft, and the parameter handler matches Path and sets in 'path' and name 'id' on the ParameterDraft. @Audit has no handler and is skipped; @trapi/metadata reports it with strict: true and fails with strict: 'throw'.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="core-hd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="432" rx="22"/>
<text class="h" x="30" y="44">Handlers match decorators and mutate drafts</text>

<text class="l" x="392" y="68">preset handlers: match</text>
<text class="l" x="686" y="68">draft after apply()</text>

<rect class="sunk" x="28" y="78" width="320" height="254" rx="13"/>
<text class="l" x="46" y="102">your controller</text>
<text class="c" x="46" y="132"><tspan class="ta">@Controller</tspan>('/users')</text>
<text class="c" x="46" y="154">export class UsersController {</text>
<text class="c" x="62" y="176"><tspan class="ta">@Get</tspan>('/:id')</text>
<text class="c" x="62" y="198"><tspan class="tw">@Audit</tspan>()</text>
<text class="c" x="62" y="220">get(<tspan class="ta">@Path</tspan>('id') id: string) {</text>
<text class="c" x="78" y="242">…</text>
<text class="c" x="62" y="264">}</text>
<text class="c" x="46" y="286">}</text>

<rect class="card" x="392" y="78" width="250" height="74" rx="13"/><rect class="ka" x="392" y="90" width="4" height="50" rx="2"/>
<text class="t" x="410" y="106">controller handler</text>
<text class="c s" x="410" y="132">match.name: 'Controller'</text>

<rect class="card" x="392" y="168" width="250" height="74" rx="13"/><rect class="ka" x="392" y="180" width="4" height="50" rx="2"/>
<text class="t" x="410" y="196">method handler</text>
<text class="c s" x="410" y="222">match.name: 'Get'</text>

<rect class="card" x="392" y="258" width="250" height="74" rx="13"/><rect class="ka" x="392" y="270" width="4" height="50" rx="2"/>
<text class="t" x="410" y="286">parameter handler</text>
<text class="c s" x="410" y="312">match.name: 'Path'</text>

<rect class="card" x="686" y="78" width="246" height="74" rx="13"/><rect class="ks" x="686" y="90" width="4" height="50" rx="2"/>
<text class="t" x="704" y="106">ControllerDraft</text>
<text class="c s" x="704" y="132">paths: ['/users']</text>

<rect class="card" x="686" y="168" width="246" height="74" rx="13"/><rect class="ks" x="686" y="180" width="4" height="50" rx="2"/>
<text class="t" x="704" y="196">MethodDraft</text>
<text class="c s" x="704" y="222">verb: 'get', path: '/:id'</text>

<rect class="card" x="686" y="258" width="246" height="74" rx="13"/><rect class="ks" x="686" y="270" width="4" height="50" rx="2"/>
<text class="t" x="704" y="286">ParameterDraft</text>
<text class="c s" x="704" y="312">in: 'path', name: 'id'</text>

<path class="rail" d="M350 128 C368 128 366 115 384 115" marker-end="url(#core-hd-arrow)"/>
<path class="rail" d="M350 172 C370 172 364 205 384 205" marker-end="url(#core-hd-arrow)"/>
<path class="rail" d="M350 216 C372 216 362 295 384 295" marker-end="url(#core-hd-arrow)"/>
<path class="rail" d="M644 115 H678" marker-end="url(#core-hd-arrow)"/>
<path class="rail" d="M644 205 H678" marker-end="url(#core-hd-arrow)"/>
<path class="rail" d="M644 295 H678" marker-end="url(#core-hd-arrow)"/>

<rect class="wo" x="392" y="344" width="170" height="26" rx="13"/><text class="to" x="477" y="362" text-anchor="middle" font-size="12" font-weight="600">3 decorators matched</text>
<rect class="ww" x="574" y="344" width="214" height="26" rx="13"/><text class="tw" x="681" y="362" text-anchor="middle" font-size="12" font-weight="600">@Audit: no handler, skipped</text>

<rect class="sunk dash" x="28" y="380" width="904" height="46" rx="13"/>
<text class="s" x="46" y="408">Unmatched decorators are skipped; @trapi/metadata reports them with strict: true and fails with strict: 'throw'.</text>
</svg>
