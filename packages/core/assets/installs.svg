<svg xmlns="http://www.w3.org/2000/svg" width="960" height="388" viewBox="0 0 960 388" role="img" aria-labelledby="core-in-title core-in-desc">
<title id="core-in-title">Who installs what</title>
<desc id="core-in-desc">A preset package lists @trapi/core as a peer dependency. @trapi/swagger depends on @trapi/core. @trapi/metadata depends on @trapi/core and has typescript 5.0.0 or later as a peer dependency. @trapi/core itself depends on @ebec/core, @validup/zod, locter, smob, validup and zod, and not on typescript, so a preset or a swagger-only install never pulls the compiler. @trapi/metadata does not re-export @trapi/core, so contract types are imported from @trapi/core directly.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="core-in-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="372" rx="22"/>
<text class="h" x="30" y="44">Who installs what</text>

<rect class="card" x="28" y="70" width="284" height="78" rx="13"/><rect class="ka" x="28" y="82" width="4" height="54" rx="2"/>
<text class="t" x="46" y="98">your preset package</text>
<text class="s" x="46" y="124">handlers only, no compiler</text>

<rect class="card" x="338" y="70" width="284" height="78" rx="13"/><rect class="ks" x="338" y="82" width="4" height="54" rx="2"/>
<text class="t" x="356" y="98">@trapi/swagger</text>
<text class="s" x="356" y="124">emits OpenAPI from Metadata</text>

<rect class="card" x="648" y="70" width="284" height="78" rx="13"/><rect class="ks" x="648" y="82" width="4" height="54" rx="2"/>
<text class="t" x="666" y="98">@trapi/metadata</text>
<text class="s" x="666" y="124">reads TypeScript source</text>

<path class="rail" d="M150 150 V227" marker-end="url(#core-in-arrow)"/>
<path class="rail" d="M440 150 V227" marker-end="url(#core-in-arrow)"/>
<path class="rail" d="M680 150 V188 H600 V227" marker-end="url(#core-in-arrow)"/>
<path class="rail" d="M860 150 V227" marker-end="url(#core-in-arrow)"/>
<rect class="wa" x="164" y="178" width="60" height="22" rx="11"/><text class="c ta" x="194" y="193" text-anchor="middle" font-size="11">peer</text>
<rect class="ws" x="454" y="178" width="110" height="22" rx="11"/><text class="c ts" x="509" y="193" text-anchor="middle" font-size="11">dependency</text>
<rect class="ws" x="694" y="158" width="110" height="22" rx="11"/><text class="c ts" x="749" y="173" text-anchor="middle" font-size="11">dependency</text>
<rect class="wa" x="736" y="198" width="110" height="22" rx="11"/><text class="c ta" x="791" y="213" text-anchor="middle" font-size="11">peer &gt;=5.0.0</text>

<rect class="card" x="28" y="230" width="594" height="88" rx="13"/><rect class="ks" x="28" y="242" width="4" height="64" rx="2"/>
<text class="t" x="46" y="258">@trapi/core</text>
<rect class="wo" x="160" y="242" width="120" height="22" rx="11"/><text class="to" x="220" y="257" text-anchor="middle" font-size="12" font-weight="600">no typescript</text>
<text class="c s" x="46" y="292">@ebec/core @validup/zod locter smob validup zod</text>

<rect class="card" x="648" y="230" width="284" height="88" rx="13"/><rect class="ka" x="648" y="242" width="4" height="64" rx="2"/>
<text class="t" x="666" y="258">typescript</text>
<text class="s" x="666" y="290">compiler API, only via metadata</text>

<rect class="sunk dash" x="28" y="330" width="904" height="38" rx="13"/>
<text class="s" x="46" y="354">@trapi/metadata does not re-export @trapi/core: import contract types from @trapi/core directly.</text>
</svg>
