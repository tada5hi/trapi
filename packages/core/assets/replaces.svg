<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="core-rp-title core-rp-desc">
<title id="core-rp-title">extends and replaces in loadRegistry</title>
<desc id="core-rp-desc">Preset app extends base and extra; each parent has a Get and a Post method handler. app declares Get with replaces: true, Post with replaces: 'extra', and a second Post without replaces. loadRegistry collects parents first in extends order, then app's own handlers. Get with replaces: true removes the Get handlers of base and extra. Post with replaces: 'extra' removes only extra's Post, so base's Post stays. The second Post of app is a sibling and stays as well. The resulting registry.methods is base Post, app Get, app Post, app Post.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="core-rp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="454" rx="22"/>
<text class="h" x="30" y="44">extends and replaces in loadRegistry</text>

<text class="l" x="28" y="78">three presets</text>
<text class="l" x="470" y="78">registry.methods walk, parents first</text>

<rect class="card" x="28" y="92" width="400" height="70" rx="13"/><rect class="ka" x="28" y="104" width="4" height="46" rx="2"/>
<text class="t" x="46" y="118">base</text>
<text class="c s" x="46" y="144">methods: Get, Post</text>

<rect class="card" x="28" y="176" width="400" height="70" rx="13"/><rect class="ka" x="28" y="188" width="4" height="46" rx="2"/>
<text class="t" x="46" y="202">extra</text>
<text class="c s" x="46" y="228">methods: Get, Post</text>

<rect class="card" x="28" y="260" width="400" height="130" rx="13"/><rect class="ka" x="28" y="272" width="4" height="106" rx="2"/>
<text class="t" x="46" y="284">app</text>
<text class="c" x="46" y="306">extends: ['base', 'extra']</text>
<text class="c" x="46" y="328">Get   replaces: <tspan class="ta">true</tspan></text>
<text class="c" x="46" y="350">Post  replaces: <tspan class="ta">'extra'</tspan></text>
<text class="c" x="46" y="372">Post  <tspan class="s">(no replaces)</tspan></text>

<path class="rail" d="M430 235 H462" marker-end="url(#core-rp-arrow)"/>

<rect class="sunk dash" x="470" y="92" width="462" height="34" rx="10"/>
<text class="c s" x="488" y="114">base · Get</text>
<rect class="wd" x="688" y="97" width="230" height="24" rx="12"/><text class="td" x="803" y="114" text-anchor="middle" font-size="12" font-weight="600">removed by replaces: true</text>

<rect class="card" x="470" y="136" width="462" height="34" rx="10"/>
<text class="c" x="488" y="158">base · Post</text>
<rect class="wo" x="688" y="141" width="230" height="24" rx="12"/><text class="to" x="803" y="158" text-anchor="middle" font-size="12" font-weight="600">kept: not from 'extra'</text>

<rect class="sunk dash" x="470" y="180" width="462" height="34" rx="10"/>
<text class="c s" x="488" y="202">extra · Get</text>
<rect class="wd" x="688" y="185" width="230" height="24" rx="12"/><text class="td" x="803" y="202" text-anchor="middle" font-size="12" font-weight="600">removed by replaces: true</text>

<rect class="sunk dash" x="470" y="224" width="462" height="34" rx="10"/>
<text class="c s" x="488" y="246">extra · Post</text>
<rect class="wd" x="688" y="229" width="230" height="24" rx="12"/><text class="td" x="803" y="246" text-anchor="middle" font-size="12" font-weight="600">removed by replaces: 'extra'</text>

<rect class="card" x="470" y="268" width="462" height="34" rx="10"/>
<text class="c" x="488" y="290">app · Get</text>
<rect class="wo" x="688" y="273" width="230" height="24" rx="12"/><text class="to" x="803" y="290" text-anchor="middle" font-size="12" font-weight="600">kept</text>

<rect class="card" x="470" y="312" width="462" height="34" rx="10"/>
<text class="c" x="488" y="334">app · Post</text>
<rect class="wo" x="688" y="317" width="230" height="24" rx="12"/><text class="to" x="803" y="334" text-anchor="middle" font-size="12" font-weight="600">kept</text>

<rect class="card" x="470" y="356" width="462" height="34" rx="10"/>
<text class="c" x="488" y="378">app · Post</text>
<rect class="wo" x="688" y="361" width="230" height="24" rx="12"/><text class="to" x="803" y="378" text-anchor="middle" font-size="12" font-weight="600">kept: siblings are additive</text>

<rect class="sunk dash" x="28" y="404" width="904" height="46" rx="13"/>
<text class="s" x="46" y="432">replaces removes only inherited handlers with the same match.name (and match.on); with strict: true, removing none throws.</text>
</svg>
