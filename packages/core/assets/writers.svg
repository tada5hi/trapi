<svg xmlns="http://www.w3.org/2000/svg" width="960" height="402" viewBox="0 0 960 402" role="img" aria-labelledby="core-wr-title core-wr-desc">
<title id="core-wr-title">What into, append and flag write on a draft</title>
<desc id="core-wr-desc">into('path').positional(0) on @Path('/users') writes path '/users'. append('tags').positionalAll() on @Tags('users', ['admin']) flattens the array argument and writes tags ['users', 'admin']. flag('hidden') on @Hidden() writes hidden true. into('path').positional(0) on @Path({ url: '/x' }) ignores the object argument and leaves path as the empty string the draft starts with.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="core-wr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="386" rx="22"/>
<text class="h" x="30" y="44">What into, append and flag write on a draft</text>

<text class="l" x="28" y="78">decorator in your code</text>
<text class="l" x="360" y="78">handler apply</text>
<text class="l" x="668" y="78">draft field afterwards</text>

<rect class="sunk" x="28" y="92" width="300" height="48" rx="12"/>
<text class="c" x="46" y="121"><tspan class="ta">@Path</tspan>('/users')</text>
<rect class="card" x="360" y="92" width="276" height="48" rx="12"/><rect class="ka" x="360" y="102" width="4" height="28" rx="2"/>
<text class="c" x="378" y="121">into('path').positional(0)</text>
<rect class="card" x="668" y="92" width="264" height="48" rx="12"/><rect class="ks" x="668" y="102" width="4" height="28" rx="2"/>
<text class="c" x="686" y="121">path: '/users'</text>

<rect class="sunk" x="28" y="152" width="300" height="48" rx="12"/>
<text class="c" x="46" y="181"><tspan class="ta">@Tags</tspan>('users', ['admin'])</text>
<rect class="card" x="360" y="152" width="276" height="48" rx="12"/><rect class="ka" x="360" y="162" width="4" height="28" rx="2"/>
<text class="c" x="378" y="181">append('tags').positionalAll()</text>
<rect class="card" x="668" y="152" width="264" height="48" rx="12"/><rect class="ks" x="668" y="162" width="4" height="28" rx="2"/>
<text class="c" x="686" y="181">tags: ['users', 'admin']</text>

<rect class="sunk" x="28" y="212" width="300" height="48" rx="12"/>
<text class="c" x="46" y="241"><tspan class="ta">@Hidden</tspan>()</text>
<rect class="card" x="360" y="212" width="276" height="48" rx="12"/><rect class="ka" x="360" y="222" width="4" height="28" rx="2"/>
<text class="c" x="378" y="241">flag('hidden')</text>
<rect class="card" x="668" y="212" width="264" height="48" rx="12"/><rect class="ks" x="668" y="222" width="4" height="28" rx="2"/>
<text class="c" x="686" y="241">hidden: true</text>

<rect class="sunk" x="28" y="272" width="300" height="48" rx="12"/>
<text class="c" x="46" y="301"><tspan class="tw">@Path</tspan>({ url: '/x' })</text>
<rect class="card" x="360" y="272" width="276" height="48" rx="12"/><rect class="ka" x="360" y="282" width="4" height="28" rx="2"/>
<text class="c" x="378" y="301">into('path').positional(0)</text>
<rect class="card" x="668" y="272" width="264" height="48" rx="12"/><rect class="kw" x="668" y="282" width="4" height="28" rx="2"/>
<text class="c" x="686" y="301">path: ''</text>
<rect class="ww" x="800" y="284" width="116" height="24" rx="12"/><text class="tw" x="858" y="301" text-anchor="middle" font-size="12" font-weight="600">not written</text>

<path class="rail" d="M330 116 H352" marker-end="url(#core-wr-arrow)"/>
<path class="rail" d="M638 116 H660" marker-end="url(#core-wr-arrow)"/>
<path class="rail" d="M330 176 H352" marker-end="url(#core-wr-arrow)"/>
<path class="rail" d="M638 176 H660" marker-end="url(#core-wr-arrow)"/>
<path class="rail" d="M330 236 H352" marker-end="url(#core-wr-arrow)"/>
<path class="rail" d="M638 236 H660" marker-end="url(#core-wr-arrow)"/>
<path class="rail dash" d="M330 296 H352" marker-end="url(#core-wr-arrow)"/>
<path class="rail dash" d="M638 296 H660" marker-end="url(#core-wr-arrow)"/>

<rect class="sunk dash" x="28" y="334" width="904" height="46" rx="13"/>
<text class="s" x="46" y="362">into() writes literal and identifier arguments only; append() flattens arrays; flag(key, value = true) reads no argument.</text>
</svg>
