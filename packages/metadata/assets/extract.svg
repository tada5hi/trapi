<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="meta-ex-title meta-ex-desc">
<title id="meta-ex-title">A decorated controller becomes Metadata</title>
<desc id="meta-ex-desc">generateMetadata reads UserController, decorated with @Controller('/users'), @Get('/:id') and @Path('id'), and returns Metadata. controllers[0] has name UserController, paths ['users'] and one method getOne with method get, path ':id', a path parameter id, a 200 response and the return type as a refObject named User. The User interface itself is stored once under referenceTypes.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="meta-ex-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="470" rx="22"/>
<text class="h" x="30" y="44">A decorated controller becomes Metadata</text>
<rect class="sunk" x="28" y="70" width="350" height="336" rx="13"/>
<text class="l" x="46" y="94">src/controllers/user.ts</text>
<text class="c" x="46" y="122">interface User {</text>
<text class="c" x="62" y="144">id: string;</text>
<text class="c" x="62" y="166">name: string;</text>
<text class="c" x="46" y="188">}</text>
<text class="c" x="46" y="222"><tspan class="ta">@Controller</tspan>('/users')</text>
<text class="c" x="46" y="244">export class UserController {</text>
<text class="c" x="62" y="266"><tspan class="ta">@Get</tspan>('/:id')</text>
<text class="c" x="62" y="288">getOne(<tspan class="ta">@Path</tspan>('id') id: string): User {</text>
<text class="c" x="78" y="310">return this.users.get(id);</text>
<text class="c" x="62" y="332">}</text>
<text class="c" x="46" y="354">}</text>
<rect class="card" x="522" y="70" width="410" height="234" rx="13"/><rect class="ks" x="522" y="84" width="4" height="206" rx="2"/>
<text class="t" x="540" y="104">controllers[0]</text>
<text class="c" x="540" y="132">name: 'UserController'</text>
<text class="c" x="540" y="154">paths: ['users']</text>
<text class="c" x="540" y="176">methods[0]:</text>
<text class="c" x="556" y="198">name: 'getOne', method: 'get', path: ':id'</text>
<text class="c" x="556" y="220">parameters[0]: in: 'path', name: 'id'</text>
<text class="c" x="556" y="242">responses[0]: status '200', schema User</text>
<text class="c" x="556" y="264">type: refObject 'User'</text>
<rect class="card" x="522" y="322" width="410" height="84" rx="13"/><rect class="ks" x="522" y="336" width="4" height="56" rx="2"/>
<text class="t" x="540" y="356">referenceTypes</text>
<text class="c" x="540" y="384">User: refObject { id: string, name: string }</text>
<path class="rail" d="M382 188 H514" marker-end="url(#meta-ex-arrow)"/>
<rect class="wa" x="382" y="150" width="136" height="22" rx="11"/><text class="c ta" font-size="11" x="450" y="165" text-anchor="middle">generateMetadata</text>
<path class="rail dash" d="M382 364 H514" marker-end="url(#meta-ex-arrow)"/>
<rect class="sunk dash" x="28" y="424" width="904" height="46" rx="13"/>
<text class="s" x="46" y="452">Paths lose their leading slash. The return type and every named type it reaches are stored once in referenceTypes.</text>
</svg>
