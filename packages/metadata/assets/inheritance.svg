<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="meta-in-title meta-in-desc">
<title id="meta-in-title">Route methods are inherited from base classes</title>
<desc id="meta-in-desc">ProjectController extends CrudController. Its own getOne with path by-slug/:id is collected first; the base getOne is skipped because the name is already taken, and the base remove method with path :id is inherited. The extends chain is walked recursively and import aliases are followed. CrudController has no @Controller decorator, so it is not a controller itself. An inherited method that fails with a ResolverError or GENERATOR_PARAMETER_GENERATION_FAILED is skipped; other errors still throw.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="meta-in-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="474" rx="22"/>
<text class="h" x="30" y="44">Route methods are inherited from base classes</text>
<rect class="sunk" x="28" y="70" width="440" height="340" rx="13"/>
<text class="l" x="46" y="94">src/controllers/project.ts</text>
<text class="c" x="46" y="120">export abstract class CrudController {</text>
<text class="c" x="62" y="142"><tspan class="ta">@Get</tspan>('/:id')</text>
<text class="c" x="62" y="164">getOne(@Path('id') id: string): Entity</text>
<text class="c" x="62" y="186"><tspan class="ta">@Delete</tspan>('/:id')</text>
<text class="c" x="62" y="208">remove(@Path('id') id: string): void</text>
<text class="c" x="46" y="230">}</text>
<text class="c" x="46" y="264"><tspan class="ta">@Controller</tspan>('/projects')</text>
<text class="c" x="46" y="286">export class ProjectController</text>
<text class="c" x="62" y="308">extends CrudController {</text>
<text class="c" x="62" y="330"><tspan class="ta">@Get</tspan>('/by-slug/:id')</text>
<text class="c" x="62" y="352">getOne(@Path('id') id: string): Entity</text>
<text class="c" x="46" y="374">}</text>
<rect class="card" x="510" y="70" width="422" height="132" rx="13"/><rect class="ks" x="510" y="84" width="4" height="104" rx="2"/>
<text class="t" x="528" y="104">ProjectController.methods</text>
<text class="c" x="528" y="136">getOne · get 'by-slug/:id'</text>
<rect class="wa" x="830" y="120" width="84" height="26" rx="13"/><text class="ta" font-size="12" font-weight="600" x="872" y="138" text-anchor="middle">own</text>
<text class="c" x="528" y="176">remove · delete ':id'</text>
<rect class="ws" x="830" y="160" width="84" height="26" rx="13"/><text class="ts" font-size="12" font-weight="600" x="872" y="178" text-anchor="middle">inherited</text>
<path class="rail" d="M472 136 H502" marker-end="url(#meta-in-arrow)"/>
<rect class="card" x="510" y="218" width="422" height="192" rx="13"/><rect class="ka" x="510" y="232" width="4" height="164" rx="2"/>
<text class="t" x="528" y="252">collection order</text>
<text class="s" x="528" y="280">1. the class's own route methods</text>
<text class="s" x="528" y="306">2. each extends base, recursively</text>
<text class="s" x="528" y="332">a name already collected is skipped: overrides win</text>
<text class="s" x="528" y="358">import aliases are followed to the base class</text>
<text class="s" x="528" y="384">the base class itself has no @Controller: no entry</text>
<rect class="sunk dash" x="28" y="428" width="904" height="46" rx="13"/>
<text class="s" x="46" y="456">An inherited method is skipped on ResolverError or GENERATOR_PARAMETER_GENERATION_FAILED; other errors still throw.</text>
</svg>
