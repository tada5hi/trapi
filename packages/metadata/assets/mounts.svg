<svg xmlns="http://www.w3.org/2000/svg" width="960" height="556" viewBox="0 0 960 556" role="img" aria-labelledby="meta-mo-title meta-mo-desc">
<title id="meta-mo-title">One controller, several mounts</title>
<desc id="meta-mo-desc">@Controller(['/roles', '/realms/:realmId/roles']) produces paths ['roles', 'realms/:realmId/roles']. A path parameter is checked against every controller path joined with the method path: @Path('realmId') on byRealm is accepted because /realms/:realmId/roles/by-realm contains it, even though /roles/by-realm does not. @Path('tenantId') matches no combination and throws GENERATOR_PARAMETER_GENERATION_FAILED.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="meta-mo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="540" rx="22"/>
<text class="h" x="30" y="44">One controller, several mounts</text>
<rect class="sunk" x="28" y="70" width="440" height="180" rx="13"/>
<text class="l" x="46" y="94">src/controllers/role.ts</text>
<text class="c" x="46" y="122"><tspan class="ta">@Controller</tspan>(['/roles', '/realms/:realmId/roles'])</text>
<text class="c" x="46" y="144">export class RoleController {</text>
<text class="c" x="62" y="166"><tspan class="ta">@Get</tspan>('/by-realm')</text>
<text class="c" x="62" y="188">byRealm(<tspan class="ta">@Path</tspan>('realmId') realmId: string)</text>
<text class="c" x="46" y="222">}</text>
<rect class="card" x="510" y="70" width="422" height="80" rx="13"/><rect class="ks" x="510" y="84" width="4" height="52" rx="2"/>
<text class="t" x="528" y="104">controllers[0].paths</text>
<text class="c" x="528" y="130">['roles', 'realms/:realmId/roles']</text>
<rect class="card" x="510" y="166" width="422" height="84" rx="13"/><rect class="ks" x="510" y="180" width="4" height="56" rx="2"/>
<text class="t" x="528" y="200">methods[0]</text>
<text class="c s" x="528" y="222">path: 'by-realm' · parameter realmId (in: 'path')</text>
<path class="rail" d="M472 110 H502" marker-end="url(#meta-mo-arrow)"/>
<path class="rail" d="M472 208 H502" marker-end="url(#meta-mo-arrow)"/>
<rect class="card" x="28" y="268" width="904" height="110" rx="13"/><rect class="ko" x="28" y="282" width="4" height="82" rx="2"/>
<text class="t" x="46" y="302">path check over every controller path × method path</text>
<text class="c" x="46" y="330">/roles/by-realm</text>
<rect class="ww" x="330" y="314" width="120" height="26" rx="13"/><text class="tw" font-size="12" font-weight="600" x="390" y="332" text-anchor="middle">no :realmId</text>
<text class="c" x="46" y="360">/realms/:realmId/roles/by-realm</text>
<rect class="wo" x="330" y="344" width="120" height="26" rx="13"/><text class="to" font-size="12" font-weight="600" x="390" y="362" text-anchor="middle">has :realmId</text>
<rect class="wo" x="520" y="314" width="236" height="26" rx="13"/><text class="to" font-size="12" font-weight="600" x="638" y="332" text-anchor="middle">@Path('realmId') is accepted</text>
<text class="s" x="520" y="364">one mount containing the name is enough</text>
<rect class="card" x="28" y="394" width="904" height="84" rx="13"/><rect class="kd" x="28" y="408" width="4" height="56" rx="2"/>
<text class="t" x="46" y="428">@Path('tenantId') throws GENERATOR_PARAMETER_GENERATION_FAILED</text>
<text class="c s" x="46" y="456">@Path('tenantId') does not exist in path '/roles/by-realm | /realms/:realmId/roles/by-realm'</text>
<rect class="sunk dash" x="28" y="494" width="904" height="46" rx="13"/>
<text class="s" x="46" y="522">Paths are normalised and de-duplicated; method paths stay single strings. @trapi/swagger emits the cross product.</text>
</svg>
