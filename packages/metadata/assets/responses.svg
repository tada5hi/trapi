<svg xmlns="http://www.w3.org/2000/svg" width="960" height="502" viewBox="0 0 960 502" role="img" aria-labelledby="meta-re-title meta-re-desc">
<title id="meta-re-title">The return type becomes the default response</title>
<desc id="meta-re-desc">A method returning Run gets a 200 Ok response with schema Run. A void method gets 204 No content with a void schema. With an explicit success status of 202 the response is 202 Accepted with the unwrapped Promise&lt;Run&gt; as schema. An explicit 204, 205 or 304 documents no schema at all, whatever the return type. The success status comes from a handler that sets draft.successStatus; a value that is not a three-digit code throws.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="meta-re-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="486" rx="22"/>
<text class="h" x="30" y="44">The return type becomes the default response</text>
<rect class="sunk" x="28" y="70" width="420" height="78" rx="13"/>
<text class="c" x="46" y="102"><tspan class="ta">@Get</tspan>('/:id')</text>
<text class="c" x="46" y="126">get(<tspan class="ta">@Path</tspan>('id') id: string): Run</text>
<rect class="card" x="490" y="70" width="442" height="78" rx="13"/><rect class="ko" x="490" y="84" width="4" height="50" rx="2"/>
<rect class="wo" x="508" y="84" width="56" height="26" rx="13"/><text class="to" font-size="12" font-weight="600" x="536" y="102" text-anchor="middle">200</text>
<text class="t" x="578" y="103">Ok</text>
<text class="c s" x="508" y="132">schema: refObject Run</text>
<path class="rail" d="M452 109 H484" marker-end="url(#meta-re-arrow)"/>
<rect class="sunk" x="28" y="160" width="420" height="78" rx="13"/>
<text class="c" x="46" y="192"><tspan class="ta">@Delete</tspan>('/:id')</text>
<text class="c" x="46" y="216">remove(<tspan class="ta">@Path</tspan>('id') id: string): void</text>
<rect class="card" x="490" y="160" width="442" height="78" rx="13"/><rect class="ko" x="490" y="174" width="4" height="50" rx="2"/>
<rect class="wo" x="508" y="174" width="56" height="26" rx="13"/><text class="to" font-size="12" font-weight="600" x="536" y="192" text-anchor="middle">204</text>
<text class="t" x="578" y="193">No content</text>
<text class="c s" x="508" y="222">schema: void (implicit 204 keeps it)</text>
<path class="rail" d="M452 199 H484" marker-end="url(#meta-re-arrow)"/>
<rect class="sunk" x="28" y="250" width="420" height="78" rx="13"/>
<text class="c" x="46" y="282"><tspan class="ta">@Post</tspan>() <tspan class="ta">@Status</tspan>(202)</text>
<text class="c" x="46" y="306">start(): Promise&lt;Run&gt;</text>
<rect class="card" x="490" y="250" width="442" height="78" rx="13"/><rect class="ko" x="490" y="264" width="4" height="50" rx="2"/>
<rect class="wo" x="508" y="264" width="56" height="26" rx="13"/><text class="to" font-size="12" font-weight="600" x="536" y="282" text-anchor="middle">202</text>
<text class="t" x="578" y="283">Accepted</text>
<text class="c s" x="508" y="312">schema: refObject Run, Promise unwrapped</text>
<path class="rail" d="M452 289 H484" marker-end="url(#meta-re-arrow)"/>
<rect class="sunk" x="28" y="340" width="420" height="78" rx="13"/>
<text class="c" x="46" y="372"><tspan class="ta">@Put</tspan>('/:id') <tspan class="ta">@Status</tspan>(204)</text>
<text class="c" x="46" y="396">replace(<tspan class="ta">@Path</tspan>('id') id: string): Run</text>
<rect class="card" x="490" y="340" width="442" height="78" rx="13"/><rect class="kw" x="490" y="354" width="4" height="50" rx="2"/>
<rect class="ww" x="508" y="354" width="56" height="26" rx="13"/><text class="tw" font-size="12" font-weight="600" x="536" y="372" text-anchor="middle">204</text>
<text class="t" x="578" y="373">No content</text>
<text class="c s" x="508" y="402">no schema: 204, 205 and 304 have no body</text>
<path class="rail" d="M452 379 H484" marker-end="url(#meta-re-arrow)"/>
<rect class="sunk dash" x="28" y="436" width="904" height="46" rx="13"/>
<text class="s" x="46" y="464">@Status is an inline registry handler that sets draft.successStatus; anything but a three-digit code throws.</text>
</svg>
