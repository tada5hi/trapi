<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="meta-st-title meta-st-desc">
<title id="meta-st-title">Unmatched decorators: silent, warn, throw or callback</title>
<desc id="meta-st-desc">@Hiden() is a typo with no handler in the preset. With strict unset it is silently ignored. strict: true prints one console.warn after generation listing each unmatched decorator with its target, host and file location. strict: 'throw' throws a GeneratorError with code GENERATOR_STRICT_UNMATCHED_DECORATORS. onUnmatchedDecorator receives the reports instead, with no warning and no throw. JSDoc tags are never reported, and any of these settings bypasses the metadata cache.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="meta-st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="470" rx="22"/>
<text class="h" x="30" y="44">Unmatched decorators: silent, warn, throw or callback</text>
<rect class="sunk" x="28" y="70" width="330" height="224" rx="13"/>
<text class="l" x="46" y="94">src/controllers/typo.ts</text>
<text class="c" x="46" y="122"><tspan class="ta">@Controller</tspan>('/typo')</text>
<text class="c" x="46" y="144"><tspan class="tw">@Hiden</tspan>()</text>
<text class="c" x="46" y="166">export class TypoController {</text>
<text class="c" x="62" y="188"><tspan class="ta">@Get</tspan>()</text>
<text class="c" x="62" y="210">list(): string[] { … }</text>
<text class="c" x="46" y="232">}</text>
<text class="s" x="46" y="270">@Hiden has no handler in the preset</text>
<rect class="card" x="392" y="70" width="540" height="50" rx="13"/><rect class="ka" x="392" y="84" width="4" height="22" rx="2"/>
<rect class="wa" x="410" y="84" width="168" height="22" rx="11"/><text class="c ta" font-size="11" x="494" y="99" text-anchor="middle">strict unset</text>
<text class="s" x="592" y="100">silent: the decorator is ignored</text>
<rect class="card" x="392" y="128" width="540" height="50" rx="13"/><rect class="kw" x="392" y="142" width="4" height="22" rx="2"/>
<rect class="wa" x="410" y="142" width="168" height="22" rx="11"/><text class="c ta" font-size="11" x="494" y="157" text-anchor="middle">strict: true</text>
<text class="tw" x="592" y="158" font-weight="600">one console.warn after generation</text>
<rect class="card" x="392" y="186" width="540" height="50" rx="13"/><rect class="kd" x="392" y="200" width="4" height="22" rx="2"/>
<rect class="wa" x="410" y="200" width="168" height="22" rx="11"/><text class="c ta" font-size="11" x="494" y="215" text-anchor="middle">strict: 'throw'</text>
<text class="c td" x="592" y="216">GENERATOR_STRICT_UNMATCHED_DECORATORS</text>
<rect class="card" x="392" y="244" width="540" height="50" rx="13"/><rect class="ko" x="392" y="258" width="4" height="22" rx="2"/>
<rect class="wa" x="410" y="258" width="168" height="22" rx="11"/><text class="c ta" font-size="11" x="494" y="273" text-anchor="middle">onUnmatchedDecorator</text>
<text class="to" x="592" y="274" font-weight="600">your callback(reports); no warn, no throw</text>
<path class="rail" d="M362 182 H384" marker-end="url(#meta-st-arrow)"/>
<rect class="sunk" x="28" y="312" width="904" height="92" rx="13"/>
<text class="l" x="46" y="336">strict: true prints</text>
<text class="c" x="46" y="360">[trapi] strict mode: decorators with no matching handler:</text>
<text class="c" x="62" y="382">- <tspan class="tw">@Hiden</tspan> on class 'TypoController' (src/controllers/typo.ts:2)</text>
<rect class="sunk dash" x="28" y="422" width="904" height="46" rx="13"/>
<text class="s" x="46" y="450">JSDoc tags are never reported. Any of these settings bypasses the metadata cache.</text>
</svg>
