<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="meta-ty-title meta-ty-desc">
<title id="meta-ty-title">Each TypeScript type resolves to a metadata type node</title>
<desc id="meta-ty-desc">Properties of the Stats interface resolve as follows. number becomes double. A number tagged with the @isInt JSDoc tag, or decorated with a handler that carries a numeric marker, becomes integer. A named tuple becomes a tuple node with its element names. Partial&lt;User&gt; becomes an inline nestedObjectLiteral whose properties are all required: false. A union of string literals becomes a union of single-member enums. The enum Role becomes a refEnum and is stored in referenceTypes.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="meta-ty-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="504" rx="22"/>
<text class="h" x="30" y="44">Each TypeScript type resolves to a metadata type node</text>
<rect class="sunk" x="28" y="70" width="440" height="370" rx="13"/>
<text class="l" x="46" y="94">src/stats.ts</text>
<text class="c" x="46" y="122">enum Role { Admin = 'admin', Member = 'member' }</text>
<text class="c" x="46" y="150">interface Stats {</text>
<text class="c" x="46" y="418">}</text>
<rect class="card" x="500" y="70" width="432" height="370" rx="13"/><rect class="ks" x="500" y="84" width="4" height="342" rx="2"/>
<text class="t" x="518" y="104">type node in Metadata</text>
<text class="c s" x="518" y="132">referenceTypes: Role (refEnum), Stats (refObject)</text>
<text class="c" x="62" y="184">score: number;</text>
<text class="c" x="518" y="184"><tspan class="ts">double</tspan></text>
<path class="rail" d="M472 179 H494" marker-end="url(#meta-ty-arrow)"/>
<text class="c" x="62" y="224"><tspan class="tw">/** @isInt */</tspan> count: number;</text>
<text class="c" x="518" y="224"><tspan class="ts">integer</tspan> · @isInt narrows number</text>
<path class="rail" d="M472 219 H494" marker-end="url(#meta-ty-arrow)"/>
<text class="c" x="62" y="264">pair: [label: string, value: number];</text>
<text class="c" x="518" y="264"><tspan class="ts">tuple</tspan> · label: string, value: double</text>
<path class="rail" d="M472 259 H494" marker-end="url(#meta-ty-arrow)"/>
<text class="c" x="62" y="304">patch: Partial&lt;User&gt;;</text>
<text class="c" x="518" y="304"><tspan class="ts">nestedObjectLiteral</tspan> · name, id (required: false)</text>
<path class="rail" d="M472 299 H494" marker-end="url(#meta-ty-arrow)"/>
<text class="c" x="62" y="344">state: 'active' | 'locked';</text>
<text class="c" x="518" y="344"><tspan class="ts">union</tspan> · enum ['active'] | enum ['locked']</text>
<path class="rail" d="M472 339 H494" marker-end="url(#meta-ty-arrow)"/>
<text class="c" x="62" y="384">role: Role;</text>
<text class="c" x="518" y="384"><tspan class="ts">refEnum</tspan> · 'Role', members ['admin', 'member']</text>
<path class="rail" d="M472 379 H494" marker-end="url(#meta-ty-arrow)"/>
<rect class="sunk dash" x="28" y="458" width="904" height="46" rx="13"/>
<text class="s" x="46" y="486">Named interfaces, aliases and enums become refObject, refAlias or refEnum and are stored once in referenceTypes.</text>
</svg>
