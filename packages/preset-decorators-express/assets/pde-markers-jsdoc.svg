<svg xmlns="http://www.w3.org/2000/svg" width="960" height="466" viewBox="0 0 960 466" role="img" aria-labelledby="pde-mj-title pde-mj-desc">
<title id="pde-mj-title">Marker decorators next to their JSDoc equivalents</title>
<desc id="pde-mj-desc">On the same node, decorator handlers run first and JSDoc handlers second. @Hidden() and /** @hidden */ on a class or method set hidden to true, which leaves it out of the document. @Deprecated() on a class, method or model class and /** @deprecated */ on a method, parameter or property set deprecated to true. @IsInt(), @IsLong(), @IsFloat() and @IsDouble() on a parameter or class property, and the matching JSDoc tags on a property or as a method tag naming a parameter, narrow number to integer, long, float or double. /** @summary */ on a method sets the summary and has no decorator form. Both forms only set values, so neither undoes the other.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="pde-mj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="450" rx="22"/>
<text class="h" x="30" y="44">Marker decorators and their JSDoc equivalents</text>
<rect class="wa" x="160" y="68" width="190" height="28" rx="14"/><text class="ta" x="255" y="87" text-anchor="middle" font-size="12" font-weight="600">1 · decorator handlers</text>
<path class="rail" d="M356 82 H426" marker-end="url(#pde-mj-arrow)"/>
<rect class="wa" x="434" y="68" width="190" height="28" rx="14"/><text class="ta" x="529" y="87" text-anchor="middle" font-size="12" font-weight="600">2 · JSDoc handlers</text>
<text class="l" x="726" y="87">writes on the draft</text>
<rect class="card" x="28" y="112" width="120" height="64" rx="12"/>
<text class="l" x="44" y="136">marker</text><text class="c ta" x="44" y="160">hidden</text>
<rect class="card" x="160" y="112" width="262" height="64" rx="12"/><rect class="ka" x="160" y="124" width="4" height="40" rx="2"/>
<text class="c" x="178" y="139">@Hidden()</text><text class="s" x="178" y="161">on a class or a method</text>
<rect class="card" x="434" y="112" width="262" height="64" rx="12"/><rect class="ka" x="434" y="124" width="4" height="40" rx="2"/>
<text class="c" x="452" y="139">/** @hidden */</text><text class="s" x="452" y="161">on a class or a method</text>
<rect class="card" x="708" y="112" width="224" height="64" rx="12"/><rect class="ks" x="708" y="124" width="4" height="40" rx="2"/>
<text class="c" x="726" y="139">hidden: true</text><text class="s" x="726" y="161">left out of the document</text>
<rect class="card" x="28" y="186" width="120" height="64" rx="12"/>
<text class="l" x="44" y="210">marker</text><text class="c ta" x="44" y="234">deprecated</text>
<rect class="card" x="160" y="186" width="262" height="64" rx="12"/><rect class="ka" x="160" y="198" width="4" height="40" rx="2"/>
<text class="c" x="178" y="213">@Deprecated()</text><text class="s" x="178" y="235">on a class, a method, a model class</text>
<rect class="card" x="434" y="186" width="262" height="64" rx="12"/><rect class="ka" x="434" y="198" width="4" height="40" rx="2"/>
<text class="c" x="452" y="213">/** @deprecated */</text><text class="s" x="452" y="235">on a method, a parameter, a property</text>
<rect class="card" x="708" y="186" width="224" height="64" rx="12"/><rect class="ks" x="708" y="198" width="4" height="40" rx="2"/>
<text class="c" x="726" y="213">deprecated: true</text><text class="s" x="726" y="235">operation or schema</text>
<rect class="card" x="28" y="260" width="120" height="64" rx="12"/>
<text class="l" x="44" y="284">marker</text><text class="c ta" x="44" y="308">numeric</text>
<rect class="card" x="160" y="260" width="262" height="64" rx="12"/><rect class="ka" x="160" y="272" width="4" height="40" rx="2"/>
<text class="c" x="178" y="287">@IsInt() @IsLong() …</text><text class="s" x="178" y="309">on a parameter or a class property</text>
<rect class="card" x="434" y="260" width="262" height="64" rx="12"/><rect class="ka" x="434" y="272" width="4" height="40" rx="2"/>
<text class="c" x="452" y="287">/** @isInt id */</text><text class="s" x="452" y="309">on a method or a property</text>
<rect class="card" x="708" y="260" width="224" height="64" rx="12"/><rect class="ks" x="708" y="272" width="4" height="40" rx="2"/>
<text class="c" x="726" y="287">typeName: 'integer'</text><text class="s" x="726" y="309">long, float, double alike</text>
<rect class="card" x="28" y="334" width="120" height="64" rx="12"/>
<text class="l" x="44" y="358">marker</text><text class="c ta" x="44" y="382">(none)</text>
<rect class="card" x="160" y="334" width="262" height="64" rx="12"/><rect class="ka" x="160" y="346" width="4" height="40" rx="2"/>
<text class="c" x="178" y="361">no decorator form</text><text class="s" x="178" y="383"></text>
<rect class="card" x="434" y="334" width="262" height="64" rx="12"/><rect class="ka" x="434" y="346" width="4" height="40" rx="2"/>
<text class="c" x="452" y="361">/** @summary Count users */</text><text class="s" x="452" y="383">on a method</text>
<rect class="card" x="708" y="334" width="224" height="64" rx="12"/><rect class="ks" x="708" y="346" width="4" height="40" rx="2"/>
<text class="c" x="726" y="361">summary: 'Count users'</text><text class="s" x="726" y="383">operation summary</text>
<rect class="sunk dash" x="28" y="414" width="904" height="36" rx="13"/>
<text class="s" x="46" y="437">Both forms only ever set a value, never clear one: either form alone is enough, and neither can undo the other.</text>
</svg>
