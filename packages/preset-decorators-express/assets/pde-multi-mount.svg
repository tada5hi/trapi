<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-labelledby="pde-mm-title pde-mm-desc">
<title id="pde-mm-title">A controller mounted at two paths</title>
<desc id="pde-mm-desc">@Controller(['/roles', '/realms/:realmId/roles']) on RoleController with @Get('/') list and @Get('/:id') get produces four OpenAPI operations: GET /roles (List), GET /realms/{realmId}/roles (List_2), GET /roles/{id} (Get) and GET /realms/{realmId}/roles/{id} (Get_2). id comes from @Params('id'); realmId is not a decorated argument and is synthesized as a required string path parameter on the two realm operations.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="pde-mm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="408" rx="22"/>
<text class="h" x="30" y="44">One controller, two mounts: the cross product the emitter writes</text>
<rect class="sunk" x="28" y="70" width="430" height="284" rx="13"/>
<text class="l" x="46" y="94">your controller</text>
<text class="c" x="46" y="122"><tspan class="ta">@Controller</tspan>(['/roles',</text>
<text class="c" x="62" y="144">'/realms/:realmId/roles'])</text>
<text class="c" x="46" y="166">export class RoleController {</text>
<text class="c" x="62" y="188"><tspan class="ta">@Get</tspan>('/')</text>
<text class="c" x="62" y="210">list(): Role[] { … }</text>
<text class="c" x="62" y="240"><tspan class="ta">@Get</tspan>('/:id')</text>
<text class="c" x="62" y="262">get(<tspan class="ta">@Params</tspan>('id') id: string): Role {</text>
<text class="c" x="78" y="284">…</text>
<text class="c" x="62" y="306">}</text>
<text class="c" x="46" y="328">}</text>
<path class="rail" d="M460 226 H492" marker-end="url(#pde-mm-arrow)"/>
<text class="l" x="518" y="88">OpenAPI 3.1 operations</text>
<rect class="card" x="500" y="100" width="432" height="56" rx="12"/><rect class="ks" x="500" y="110" width="4" height="36" rx="2"/>
<text class="c" x="518" y="123"><tspan class="ts" font-weight="600">GET</tspan> /roles</text>
<text class="c s" x="914" y="123" text-anchor="end">List</text>
<text class="s" x="518" y="144">no path parameters</text>
<rect class="card" x="500" y="166" width="432" height="56" rx="12"/><rect class="ks" x="500" y="176" width="4" height="36" rx="2"/>
<text class="c" x="518" y="189"><tspan class="ts" font-weight="600">GET</tspan> /realms/{realmId}/roles</text>
<text class="c s" x="914" y="189" text-anchor="end">List_2</text>
<text class="s" x="518" y="210"><tspan class="tw" font-weight="600">realmId</tspan> synthesized: required string</text>
<rect class="card" x="500" y="232" width="432" height="56" rx="12"/><rect class="ks" x="500" y="242" width="4" height="36" rx="2"/>
<text class="c" x="518" y="255"><tspan class="ts" font-weight="600">GET</tspan> /roles/{id}</text>
<text class="c s" x="914" y="255" text-anchor="end">Get</text>
<text class="s" x="518" y="276"><tspan class="ts" font-weight="600">id</tspan> from @Params('id')</text>
<rect class="card" x="500" y="298" width="432" height="56" rx="12"/><rect class="ks" x="500" y="308" width="4" height="36" rx="2"/>
<text class="c" x="518" y="321"><tspan class="ts" font-weight="600">GET</tspan> /realms/{realmId}/roles/{id}</text>
<text class="c s" x="914" y="321" text-anchor="end">Get_2</text>
<text class="s" x="518" y="342"><tspan class="ts" font-weight="600">id</tspan> from @Params('id'), <tspan class="tw" font-weight="600">realmId</tspan> synthesized</text>
<rect class="sunk dash" x="28" y="372" width="904" height="36" rx="13"/>
<text class="s" x="46" y="395">@Mount on a class takes the same string or array. A method path stays a single string, so only the controller multiplies.</text>
</svg>
