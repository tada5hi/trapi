<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="pde-pm-title pde-pm-desc">
<title id="pde-pm-title">Parameter binders and the parameter kind each produces</title>
<desc id="pde-pm-desc">With a name argument, @Body becomes bodyProp, @Query becomes queryProp, @Params becomes path, @Headers becomes header and @Cookies becomes cookie. Without an argument, @Body becomes body and @Query becomes query, which is split into one queryProp per property of its type, while @Params, @Headers and @Cookies bind the whole object and become context. @Request, @Response and @Next always become context, and context parameters are not emitted.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="pde-pm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="444" rx="22"/>
<text class="h" x="30" y="44">Which parameter kind each @decorators/express binder produces</text>
<text class="l" x="46" y="86">decorator</text><text class="l" x="208" y="86">with a name argument</text><text class="l" x="586" y="86">without an argument</text>
<rect class="card" x="28" y="100" width="150" height="40" rx="11"/><rect class="ka" x="28" y="108" width="4" height="24" rx="2"/>
<text class="c ta" x="46" y="125">@Body</text>
<rect class="card" x="190" y="100" width="366" height="40" rx="11"/>
<text class="c" x="208" y="125">@Body('note')</text>
<rect class="ws" x="420" y="107" width="120" height="26" rx="13"/><text class="ts" x="480" y="125" text-anchor="middle" font-size="12" font-weight="600">in: bodyProp</text>
<rect class="card" x="568" y="100" width="364" height="40" rx="11"/>
<text class="c" x="586" y="125">@Body()</text>
<rect class="ws" x="680" y="107" width="120" height="26" rx="13"/><text class="ts" x="740" y="125" text-anchor="middle" font-size="12" font-weight="600">in: body</text>

<rect class="card" x="28" y="150" width="150" height="40" rx="11"/><rect class="ka" x="28" y="158" width="4" height="24" rx="2"/>
<text class="c ta" x="46" y="175">@Query</text>
<rect class="card" x="190" y="150" width="366" height="40" rx="11"/>
<text class="c" x="208" y="175">@Query('page')</text>
<rect class="ws" x="420" y="157" width="120" height="26" rx="13"/><text class="ts" x="480" y="175" text-anchor="middle" font-size="12" font-weight="600">in: queryProp</text>
<rect class="card" x="568" y="150" width="364" height="40" rx="11"/>
<text class="c" x="586" y="175">@Query()</text>
<rect class="ws" x="680" y="157" width="120" height="26" rx="13"/><text class="ts" x="740" y="175" text-anchor="middle" font-size="12" font-weight="600">in: query</text>
<text class="s" x="812" y="175">→ split by field</text>
<rect class="card" x="28" y="200" width="150" height="40" rx="11"/><rect class="ka" x="28" y="208" width="4" height="24" rx="2"/>
<text class="c ta" x="46" y="225">@Params</text>
<rect class="card" x="190" y="200" width="366" height="40" rx="11"/>
<text class="c" x="208" y="225">@Params('id')</text>
<rect class="ws" x="420" y="207" width="120" height="26" rx="13"/><text class="ts" x="480" y="225" text-anchor="middle" font-size="12" font-weight="600">in: path</text>
<rect class="card" x="568" y="200" width="364" height="40" rx="11"/>
<text class="c" x="586" y="225">@Params()</text>
<rect class="wd" x="680" y="207" width="120" height="26" rx="13"/><text class="td" x="740" y="225" text-anchor="middle" font-size="12" font-weight="600">in: context</text>

<rect class="card" x="28" y="250" width="150" height="40" rx="11"/><rect class="ka" x="28" y="258" width="4" height="24" rx="2"/>
<text class="c ta" x="46" y="275">@Headers</text>
<rect class="card" x="190" y="250" width="366" height="40" rx="11"/>
<text class="c" x="208" y="275">@Headers('x-request-id')</text>
<rect class="ws" x="420" y="257" width="120" height="26" rx="13"/><text class="ts" x="480" y="275" text-anchor="middle" font-size="12" font-weight="600">in: header</text>
<rect class="card" x="568" y="250" width="364" height="40" rx="11"/>
<text class="c" x="586" y="275">@Headers()</text>
<rect class="wd" x="680" y="257" width="120" height="26" rx="13"/><text class="td" x="740" y="275" text-anchor="middle" font-size="12" font-weight="600">in: context</text>

<rect class="card" x="28" y="300" width="150" height="40" rx="11"/><rect class="ka" x="28" y="308" width="4" height="24" rx="2"/>
<text class="c ta" x="46" y="325">@Cookies</text>
<rect class="card" x="190" y="300" width="366" height="40" rx="11"/>
<text class="c" x="208" y="325">@Cookies('session')</text>
<rect class="ws" x="420" y="307" width="120" height="26" rx="13"/><text class="ts" x="480" y="325" text-anchor="middle" font-size="12" font-weight="600">in: cookie</text>
<rect class="card" x="568" y="300" width="364" height="40" rx="11"/>
<text class="c" x="586" y="325">@Cookies()</text>
<rect class="wd" x="680" y="307" width="120" height="26" rx="13"/><text class="td" x="740" y="325" text-anchor="middle" font-size="12" font-weight="600">in: context</text>

<rect class="card" x="28" y="350" width="150" height="40" rx="11"/><rect class="ka" x="28" y="358" width="4" height="24" rx="2"/>
<text class="c ta" x="46" y="375">@Request</text>
<rect class="card" x="190" y="350" width="742" height="40" rx="11"/>
<text class="c" x="208" y="375">@Request()  @Response()  @Next()</text>
<rect class="wd" x="500" y="357" width="300" height="26" rx="13"/><text class="td" x="650" y="375" text-anchor="middle" font-size="12" font-weight="600">in: context, always: no parameter emitted</text>
<rect class="sunk dash" x="28" y="408" width="904" height="36" rx="13"/>
<text class="s" x="46" y="431">Also mapped: @BodyProp @QueryProp @Path @PathParam @Param @Header @Cookie @Form @FormProp @File @Files</text>
</svg>
