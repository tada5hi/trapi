<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" role="img" aria-labelledby="ptr-res-title ptr-res-desc">
<title id="ptr-res-title">@Description and @Example become responses</title>
<desc id="ptr-res-desc">On the method get, @Description&lt;ApiError&gt;(404, 'User not found', { message: 'not found' }) adds a handler response with status 404, that description, the payload as its example and the ApiError type argument as its schema. @Example&lt;User&gt;({ id: 1, name: 'Ada' }) adds an example to the default response, which is status 200, description Ok, with the User return type as schema. @Description() with no status documents status 200 with description Response. @Description(200, 'OK') without a type argument takes the place of the default 200 response and carries no schema. A status that cannot be resolved, such as @Description(computeStatus()), throws CORE_DECORATOR_ARGUMENT_INVALID.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="ptr-res-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="496" rx="22"/>
<text class="h" x="30" y="44">@Description and @Example become responses</text>

<rect class="sunk" x="28" y="70" width="412" height="230" rx="13"/>
<text class="l" x="46" y="96">your service</text>
<text class="c" x="46" y="128"><tspan class="ta">@GET</tspan> <tspan class="ta">@Path</tspan>(':id')</text>
<text class="c" x="46" y="150"><tspan class="ta">@Description</tspan>&lt;ApiError&gt;(404, 'User not found',</text>
<text class="c" x="78" y="172">{ message: 'not found' })</text>
<text class="c" x="46" y="194"><tspan class="ta">@Example</tspan>&lt;User&gt;({ id: 1, name: 'Ada' })</text>
<text class="c" x="46" y="216">get(<tspan class="ta">@PathParam</tspan>('id') id: number): User</text>
<text class="s" x="46" y="252">(status, description, example): all optional</text>
<text class="s" x="46" y="274">(example) only: no label argument</text>

<rect class="card" x="490" y="70" width="442" height="108" rx="13"/><rect class="ks" x="490" y="84" width="4" height="80" rx="2"/>
<text class="t" x="508" y="96">responses[0] · status '404'</text>
<text class="c s" x="508" y="120">description: 'User not found'</text>
<text class="c s" x="508" y="142">schema: ApiError (type argument)</text>
<text class="c s" x="508" y="164">examples: [{ message: 'not found' }]</text>

<rect class="card" x="490" y="192" width="442" height="108" rx="13"/><rect class="ks" x="490" y="206" width="4" height="80" rx="2"/>
<text class="t" x="508" y="218">responses[1] · status '200' (default)</text>
<text class="c s" x="508" y="242">description: 'Ok'</text>
<text class="c s" x="508" y="264">schema: User (return type)</text>
<text class="c s" x="508" y="286">examples: [{ id: 1, name: 'Ada' }]</text>

<path class="rail" d="M442 146 H462 V124 H482" marker-end="url(#ptr-res-arrow)"/>
<path class="rail" d="M442 190 H462 V246 H482" marker-end="url(#ptr-res-arrow)"/>

<rect class="card" x="28" y="322" width="290" height="100" rx="13"/><rect class="ko" x="28" y="336" width="4" height="72" rx="2"/>
<text class="c" x="46" y="350">@Description()</text>
<text class="s" x="46" y="376">no status: documented as '200',</text>
<text class="s" x="46" y="398">description 'Response'</text>

<rect class="card" x="335" y="322" width="290" height="100" rx="13"/><rect class="kw" x="335" y="336" width="4" height="72" rx="2"/>
<text class="c" x="353" y="350">@Description(200, 'OK')</text>
<text class="s" x="353" y="376">same status as the default response:</text>
<text class="s" x="353" y="398">it takes its place, with no schema</text>

<rect class="card" x="642" y="322" width="290" height="100" rx="13"/><rect class="kd" x="642" y="336" width="4" height="72" rx="2"/>
<text class="c" x="660" y="350">@Description(computeStatus())</text>
<text class="s" x="660" y="376">unresolvable status: generation throws</text>
<text class="c td" x="660" y="400">CORE_DECORATOR_ARGUMENT_INVALID</text>

<rect class="sunk dash" x="28" y="440" width="904" height="52" rx="13"/>
<text class="s" x="46" y="471">Status: a literal (404, '404') or a constant the compiler resolves. Description: a string literal, else 'Response'.</text>
</svg>
