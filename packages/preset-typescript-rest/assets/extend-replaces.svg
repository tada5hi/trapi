<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" viewBox="0 0 960 504" role="img" aria-labelledby="ptr-ext-title ptr-ext-desc">
<title id="ptr-ext-title">Extending the preset with extends and replaces</title>
<desc id="ptr-ext-desc">A user preset named my-app/preset extends @trapi/preset-typescript-rest and adds two parameter handlers built by a formParam helper that writes in: formData. formParam('FormParam') matches a name the parent does not handle, so it is simply added. formParam('Param', '@trapi/preset-typescript-rest') sets replaces to the parent's name, which removes the parent's Param handler that wrote queryProp. In the merged registry the parent's remaining handlers come first (the five Context names, QueryParam, HeaderParam, CookieParam, PathParam, FileParam, FilesParam, Extension and the numeric markers), followed by the two my-app handlers.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="ptr-ext-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="488" rx="22"/>
<text class="h" x="30" y="44">Extending the preset: add a handler, replace a handler</text>

<rect class="sunk" x="28" y="70" width="490" height="334" rx="13"/>
<text class="l" x="46" y="96">your preset</text>
<text class="c" x="46" y="128">const preset: Preset = {</text>
<text class="c" x="62" y="150">name: 'my-app/preset',</text>
<text class="c" x="62" y="172"><tspan class="ta">extends</tspan>: ['@trapi/preset-typescript-rest'],</text>
<text class="c" x="62" y="194">parameters: [</text>
<text class="c" x="78" y="216">formParam('FormParam'),</text>
<text class="c" x="78" y="238">formParam('Param', <tspan class="ta">'@trapi/preset-typescript-rest'</tspan>),</text>
<text class="c" x="62" y="260">],</text>
<text class="c" x="46" y="282">};</text>
<text class="s" x="46" y="330">formParam(name, replaces?) returns a parameter()</text>
<text class="s" x="46" y="352">handler that sets in: 'formData' and reads the name;</text>
<text class="s" x="46" y="374">its second argument becomes the handler's replaces.</text>

<rect class="card" x="560" y="70" width="372" height="334" rx="13"/><rect class="ks" x="560" y="84" width="4" height="26" rx="2"/>
<text class="t" x="576" y="98">Registry.parameters, in run order</text>
<text class="l" x="576" y="122">from @trapi/preset-typescript-rest</text>
<text class="l" x="576" y="326">from my-app/preset</text>
<rect class="sunk" x="576" y="130" width="262" height="24" rx="12"/><text class="c " x="588" y="146" font-size="12">ContextRequest … ContextAccept</text>
<rect class="wo" x="846" y="130" width="70" height="24" rx="12"/><text class="to" x="881" y="146" text-anchor="middle" font-size="12" font-weight="600">kept</text>
<rect class="sunk" x="576" y="160" width="262" height="24" rx="12"/><text class="c " x="588" y="176" font-size="12">QueryParam · HeaderParam</text>
<rect class="wo" x="846" y="160" width="70" height="24" rx="12"/><text class="to" x="881" y="176" text-anchor="middle" font-size="12" font-weight="600">kept</text>
<rect class="sunk" x="576" y="190" width="262" height="24" rx="12"/><text class="c " x="588" y="206" font-size="12">CookieParam · PathParam</text>
<rect class="wo" x="846" y="190" width="70" height="24" rx="12"/><text class="to" x="881" y="206" text-anchor="middle" font-size="12" font-weight="600">kept</text>
<rect class="sunk" x="576" y="220" width="262" height="24" rx="12"/><text class="c " x="588" y="236" font-size="12">FileParam · FilesParam</text>
<rect class="wo" x="846" y="220" width="70" height="24" rx="12"/><text class="to" x="881" y="236" text-anchor="middle" font-size="12" font-weight="600">kept</text>
<rect class="wd" x="576" y="250" width="262" height="24" rx="12"/><text class="c td" x="588" y="266" font-size="12">Param → queryProp</text>
<rect class="wd" x="846" y="250" width="70" height="24" rx="12"/><text class="td" x="881" y="266" text-anchor="middle" font-size="12" font-weight="600">removed</text>
<rect class="sunk" x="576" y="280" width="262" height="24" rx="12"/><text class="c " x="588" y="296" font-size="12">Extension · IsInt … IsDouble</text>
<rect class="wo" x="846" y="280" width="70" height="24" rx="12"/><text class="to" x="881" y="296" text-anchor="middle" font-size="12" font-weight="600">kept</text>
<rect class="wa" x="576" y="334" width="262" height="24" rx="12"/><text class="c ta" x="588" y="350" font-size="12">FormParam → formData</text>
<rect class="wa" x="846" y="334" width="70" height="24" rx="12"/><text class="ta" x="881" y="350" text-anchor="middle" font-size="12" font-weight="600">added</text>
<rect class="wa" x="576" y="364" width="262" height="24" rx="12"/><text class="c ta" x="588" y="380" font-size="12">Param → formData</text>
<rect class="wa" x="846" y="364" width="70" height="24" rx="12"/><text class="ta" x="881" y="380" text-anchor="middle" font-size="12" font-weight="600">added</text>

<path class="rail" d="M520 212 H546 V346 H572" marker-end="url(#ptr-ext-arrow)"/>
<path class="rail" d="M520 234 H536 V376 H572" marker-end="url(#ptr-ext-arrow)"/>

<rect class="sunk dash" x="28" y="420" width="904" height="64" rx="13"/>
<text class="s" x="46" y="446">Parent handlers run first, yours after. replaces: '@trapi/preset-typescript-rest' removes only that preset's Param handler;</text>
<text class="s" x="46" y="468">without it both Param handlers would run, and yours would still win because it runs last.</text>
</svg>
