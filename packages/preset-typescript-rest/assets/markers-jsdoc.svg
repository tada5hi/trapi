<rect class="wa" x="150" y="301" width="97" height="24" rx="12"/><text class="c ta" x="160" y="317" font-size="12">@Extension</text>
<rect class="wa" x="346" y="301" width="97" height="24" rx="12"/><text class="c ta" x="356" y="317" font-size="12">@Extension</text>
<rect class="wa" x="578" y="301" width="97" height="24" rx="12"/><text class="c ta" x="588" y="317" font-size="12">@Extension</text>
<rect class="wa" x="754" y="301" width="97" height="24" rx="12"/><text class="c ta" x="764" y="317" font-size="12">@Extension</text>
