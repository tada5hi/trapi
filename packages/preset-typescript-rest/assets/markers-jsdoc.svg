<text class="s" x="46" y="482">Decorator handlers run first on each node, then JSDoc handlers. A dash means the preset does not handle it there.</text>
<text class="s" x="46" y="504">The numeric JSDoc tags narrow model properties only; on a method argument, use @IsInt … @IsDouble.</text>
</svg>
