<text class="s" x="44" y="355">summary</text>
<text class="s" x="158" y="355">–</text>
<rect class="sunk" x="346" y="339" width="82" height="24" rx="12"/><text class="c" x="356" y="355" font-size="12">@summary</text>
<text class="s" x="586" y="355">–</text>
