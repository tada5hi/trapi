<rect class="wa" x="150" y="263" width="89" height="24" rx="12"/><text class="c ta" x="160" y="279" font-size="12">@Consumes</text>
<rect class="wa" x="247" y="263" width="74" height="24" rx="12"/><text class="c ta" x="257" y="279" font-size="12">@Accept</text>
<rect class="wa" x="346" y="263" width="89" height="24" rx="12"/><text class="c ta" x="356" y="279" font-size="12">@Consumes</text>
<rect class="wa" x="443" y="263" width="74" height="24" rx="12"/><text class="c ta" x="453" y="279" font-size="12">@Accept</text>
