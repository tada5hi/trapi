<text class="s" x="44" y="203">tags</text>
<rect class="wa" x="150" y="187" width="58" height="24" rx="12"/><text class="c ta" x="160" y="203" font-size="12">@Tags</text>
<rect class="wa" x="346" y="187" width="58" height="24" rx="12"/><text class="c ta" x="356" y="203" font-size="12">@Tags</text>
<text class="s" x="586" y="203">–</text>
<text class="s" x="762" y="203">–</text>
<line class="rule" x1="40" y1="218" x2="920" y2="218"/>
<text class="s" x="44" y="241">produces</text>
<rect class="wa" x="150" y="225" width="89" height="24" rx="12"/><text class="c ta" x="160" y="241" font-size="12">@Produces</text>
<rect class="wa" x="346" y="225" width="89" height="24" rx="12"/><text class="c ta" x="356" y="241" font-size="12">@Produces</text>
<text class="s" x="586" y="241">–</text>
