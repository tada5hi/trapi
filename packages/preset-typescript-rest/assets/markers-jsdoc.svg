<text class="s" x="354" y="393">–</text>
<rect class="wa" x="578" y="377" width="159" height="24" rx="12"/><text class="c ta" x="588" y="393" font-size="12">@IsInt … @IsDouble</text>
<rect class="wa" x="754" y="377" width="159" height="24" rx="12"/><text class="c ta" x="764" y="393" font-size="12">@IsInt … @IsDouble</text>
