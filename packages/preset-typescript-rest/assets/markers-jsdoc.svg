<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img" aria-labelledby="ptr-mk-title ptr-mk-desc">
<title id="ptr-mk-title">TRAPI markers and JSDoc tags this preset handles, per target</title>
<desc id="ptr-mk-desc">Which markers this preset handles on each target. Hidden: @Hidden and the JSDoc tag @hidden on a class and on a method. Deprecated: @Deprecated on a class, @Deprecated and @deprecated on a method, the JSDoc tag @deprecated on a parameter and on a model property. @Tags, @Produces, and @Consumes or @Accept on a class and a method. @Extension on a class, method, parameter and model property. The JSDoc tag @summary on a method. Numeric markers: @IsInt, @IsLong, @IsFloat and @IsDouble on a parameter and a model property, plus the JSDoc tags @isInt to @isDouble on a model property. Decorator handlers run first on each node, then JSDoc handlers.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
.rule{stroke:var(--border);stroke-width:1}
</style>
<rect class="canvas" x="8" y="8" width="944" height="528" rx="22"/>
<text class="h" x="30" y="44">Markers and JSDoc tags, by where they are read</text>
<rect class="wa" x="738" y="28" width="92" height="24" rx="12"/><text class="c ta" x="784" y="44" text-anchor="middle" font-size="12">decorator</text>
<rect class="sunk" x="838" y="28" width="94" height="24" rx="12"/><text class="c" x="885" y="44" text-anchor="middle" font-size="12">JSDoc tag</text>
<rect class="card" x="28" y="70" width="904" height="370" rx="13"/>
<text class="l" x="44" y="92">marker</text><text class="l" x="150" y="92">class</text><text class="l" x="346" y="92">method</text><text class="l" x="578" y="92">parameter</text><text class="l" x="754" y="92">model property</text>
<line class="rule" x1="40" y1="104" x2="920" y2="104"/>
<text class="s" x="44" y="127">hidden</text>
