<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="ptr-svc-title ptr-svc-desc">
<title id="ptr-svc-title">A typescript-rest service and the metadata this preset extracts</title>
<desc id="ptr-svc-desc">The class UserService is decorated with @Path('/users'). Its method get carries @GET and @Path(':id') and takes @PathParam('id') @IsInt id: number and @ContextRequest req. The preset turns @Path on the class into Controller.paths ['users'], @GET plus @Path on the method into method 'get' with path ':id' and a default 200 response with the User return type, and @PathParam with @IsInt into a path parameter id of type integer. The @ContextRequest parameter produces no parameter and its type is never resolved.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="ptr-svc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="454" rx="22"/>
<text class="h" x="30" y="44">One typescript-rest service, the metadata this preset extracts</text>

<!-- source -->
<rect class="sunk" x="28" y="70" width="420" height="256" rx="13"/>
<text class="l" x="46" y="96">your service (typescript-rest)</text>
<text class="c" x="46" y="128"><tspan class="ta">@Path</tspan>('/users')</text>
<text class="c" x="46" y="150">export class UserService {</text>
<text class="c" x="62" y="172"><tspan class="ta">@GET</tspan></text>
<text class="c" x="62" y="194"><tspan class="ta">@Path</tspan>(':id')</text>
<text class="c" x="62" y="216">get(</text>
<text class="c" x="78" y="238"><tspan class="ta">@PathParam</tspan>('id') <tspan class="ta">@IsInt</tspan> id: number,</text>
<text class="c" x="78" y="260"><tspan class="td">@ContextRequest</tspan> req: Request,</text>
<text class="c" x="62" y="282">): User { … }</text>
<text class="c" x="46" y="304">}</text>

<!-- metadata -->
<rect class="card" x="530" y="70" width="402" height="72" rx="13"/><rect class="ks" x="530" y="84" width="4" height="44" rx="2"/>
<text class="t" x="548" y="96">Controller</text>
<text class="c s" x="548" y="122">name: 'UserService', paths: ['users']</text>

<rect class="card" x="530" y="156" width="402" height="94" rx="13"/><rect class="ks" x="530" y="170" width="4" height="66" rx="2"/>
<text class="t" x="548" y="182">Method</text>
<text class="c s" x="548" y="208">method: 'get', path: ':id'</text>
<text class="c s" x="548" y="230">responses: [{ status: '200', schema: User }]</text>

<rect class="card" x="530" y="264" width="402" height="72" rx="13"/><rect class="ks" x="530" y="278" width="4" height="44" rx="2"/>
<text class="t" x="548" y="290">Parameter</text>
<text class="c s" x="548" y="316">in: 'path', name: 'id', type: integer</text>

<rect class="wd" x="530" y="350" width="402" height="26" rx="13"/>
<text class="td" x="731" y="368" text-anchor="middle" font-size="12" font-weight="600">context: no parameter, type never resolved</text>

<!-- rails -->
<path class="rail" d="M450 124 H486 V106 H522" marker-end="url(#ptr-svc-arrow)"/>
<path class="rail" d="M450 190 H486 V203 H522" marker-end="url(#ptr-svc-arrow)"/>
<path class="rail" d="M450 234 H486 V300 H522" marker-end="url(#ptr-svc-arrow)"/>
<path class="rail dash" d="M450 256 H470 V363 H522" marker-end="url(#ptr-svc-arrow)"/>

<!-- footer -->
<rect class="sunk dash" x="28" y="396" width="904" height="46" rx="13"/>
<text class="s" x="46" y="424">@Path is matched twice: on a class it writes Controller.paths, on a method it writes Method.path. '/users' is stored as 'users'.</text>
</svg>
