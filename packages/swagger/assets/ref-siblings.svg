<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="sw-ref-title sw-ref-desc">
<title id="sw-ref-title">A $ref with a description: stripped in 2.0 and 3.0, kept in 3.1+</title>
<desc id="sw-ref-desc">The metadata property role has the description Access level and a refEnum type named Role. Swagger 2.0 emits only a $ref to #/definitions/Role and drops the description. OpenAPI 3.0 emits only a $ref to #/components/schemas/Role. OpenAPI 3.1 and 3.2 keep the description beside the $ref.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="sw-ref-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="404" rx="22"/>
<text class="h" x="30" y="44">A $ref with a description: stripped in 2.0 and 3.0, kept in 3.1+</text>
<rect class="sunk" x="28" y="70" width="340" height="176" rx="13"/>
<text class="l" x="46" y="94">metadata property</text>
<text class="c" x="46" y="122">{ name: 'role',</text>
<text class="c" x="62" y="144">description: 'Access level',</text>
<text class="c" x="62" y="166">type: { typeName: 'refEnum',</text>
<text class="c" x="78" y="188">refName: 'Role' } }</text>
<rect class="card" x="408" y="70" width="524" height="78" rx="13"/><rect class="ks" x="408" y="84" width="4" height="50" rx="2"/>
<rect class="ws" x="428" y="84" width="37" height="24" rx="12"/><text class="ts" x="446" y="100" text-anchor="middle" font-size="12" font-weight="600">v2</text>
<rect class="ww" x="475" y="84" width="163" height="24" rx="12"/><text class="tw" x="556" y="100" text-anchor="middle" font-size="12" font-weight="600">description dropped</text>
<text class="c" x="428" y="130">"role": { "$ref": "<tspan class="ts">#/definitions/</tspan>Role" }</text>
<rect class="card" x="408" y="160" width="524" height="78" rx="13"/><rect class="ks" x="408" y="174" width="4" height="50" rx="2"/>
<rect class="ws" x="428" y="174" width="37" height="24" rx="12"/><text class="ts" x="446" y="190" text-anchor="middle" font-size="12" font-weight="600">v3</text>
<rect class="ww" x="475" y="174" width="163" height="24" rx="12"/><text class="tw" x="556" y="190" text-anchor="middle" font-size="12" font-weight="600">description dropped</text>
<text class="c" x="428" y="220">"role": { "$ref": "<tspan class="ts">#/components/schemas/</tspan>Role" }</text>
<rect class="card" x="408" y="250" width="524" height="100" rx="13"/><rect class="ks" x="408" y="264" width="4" height="72" rx="2"/>
<rect class="ws" x="428" y="264" width="103" height="24" rx="12"/><text class="ts" x="480" y="280" text-anchor="middle" font-size="12" font-weight="600">v3.1 · v3.2</text>
<rect class="wo" x="541" y="264" width="111" height="24" rx="12"/><text class="to" x="596" y="280" text-anchor="middle" font-size="12" font-weight="600">sibling kept</text>
<text class="c" x="428" y="310">"role": { "$ref": "<tspan class="ts">#/components/schemas/</tspan>Role",</text>
<text class="c" x="444" y="332">"description": "Access level" }</text>
<path class="rail" d="M370 158 H386 V109 H399" marker-end="url(#sw-ref-arrow)"/>
<path class="rail" d="M386 158 V199 H399" marker-end="url(#sw-ref-arrow)"/>
<path class="rail" d="M386 158 V318 H399" marker-end="url(#sw-ref-arrow)"/>
<rect class="sunk dash" x="28" y="358" width="904" height="46" rx="13"/>
<text class="s" x="46" y="386">Applies to object properties. A nullable reference in 3.0 is wrapped instead: { "allOf": [{ "$ref": … }], "nullable": true }.</text>
</svg>
