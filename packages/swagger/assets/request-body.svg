<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="sw-body-title sw-body-desc">
<title id="sw-body-title">One body parameter, two request shapes, one media-type ladder</title>
<desc id="sw-body-desc">A metadata parameter named body with in body and the refObject type User becomes, in Swagger 2.0, a parameter with in body and a schema $ref to #/definitions/User, and in OpenAPI 3.x a requestBody whose content is keyed by media type. The media type comes from the first rule that applies: the method's consumes merged with the controller's, multipart/form-data for a file or buffer form field, application/x-www-form-urlencoded for other form fields, then a version-specific fallback: application/json in v2 for a body or a post, put or patch; data.consumes, then application/json, in v3.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="sw-body-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="644" rx="22"/>
<text class="h" x="30" y="44">One body parameter, two request shapes, one media-type ladder</text>
<rect class="sunk" x="28" y="70" width="300" height="246" rx="13"/>
<text class="l" x="46" y="94">metadata parameter</text>
<text class="c" x="46" y="122">{ name: 'body',</text>
<text class="c" x="62" y="144">in: 'body',</text>
<text class="c" x="62" y="166">required: true,</text>
<text class="c" x="62" y="188">type: { typeName: 'refObject',</text>
<text class="c" x="78" y="210">refName: 'User' } }</text>
<rect class="card" x="368" y="70" width="564" height="140" rx="13"/><rect class="ks" x="368" y="84" width="4" height="112" rx="2"/>
<text class="t" x="386" y="102">v2: a parameter in the operation</text>
<text class="c" x="386" y="126">"consumes": ["application/json"],</text>
<text class="c" x="386" y="148">"parameters": [{ <tspan class="ts">"in": "body"</tspan>, "name": "body", "required": true,</text>
<text class="c" x="402" y="170">"schema": { "$ref": "#/definitions/User" } }]</text>
<rect class="card" x="368" y="222" width="564" height="140" rx="13"/><rect class="ks" x="368" y="236" width="4" height="112" rx="2"/>
<text class="t" x="386" y="254">v3 · v3.1 · v3.2: requestBody</text>
<text class="c" x="386" y="278"><tspan class="ts">"requestBody"</tspan>: { "required": true,</text>
<text class="c" x="402" y="300">"content": { "application/json": {</text>
<text class="c" x="418" y="322">"schema": { "$ref": "#/components/schemas/User" } } } }</text>
<path class="rail" d="M330 193 H346 V140 H359" marker-end="url(#sw-body-arrow)"/>
<path class="rail" d="M346 193 V292 H359" marker-end="url(#sw-body-arrow)"/>
<rect class="card" x="28" y="380" width="904" height="196" rx="13"/><rect class="ka" x="28" y="394" width="4" height="168" rx="2"/>
<text class="t" x="46" y="412">Which media type wins: first rule that applies</text>
<rect class="wa" x="46" y="424" width="29" height="24" rx="12"/><text class="ta" x="60" y="440" text-anchor="middle" font-size="12" font-weight="600">1</text>
<text class="s" x="86" y="440">method.consumes, controller entries merged in first</text>
<text class="c" x="560" y="440">as declared</text>
<rect class="wa" x="46" y="450" width="29" height="24" rx="12"/><text class="ta" x="60" y="466" text-anchor="middle" font-size="12" font-weight="600">2</text>
<text class="s" x="86" y="466">a formData parameter of type file or buffer</text>
<text class="c" x="560" y="466">multipart/form-data</text>
<rect class="wa" x="46" y="476" width="29" height="24" rx="12"/><text class="ta" x="60" y="492" text-anchor="middle" font-size="12" font-weight="600">3</text>
<text class="s" x="86" y="492">any other formData parameter</text>
<text class="c" x="560" y="492">application/x-www-form-urlencoded</text>
<rect class="wa" x="46" y="502" width="29" height="24" rx="12"/><text class="ta" x="60" y="518" text-anchor="middle" font-size="12" font-weight="600">4</text>
<text class="s" x="86" y="518">v2: a body parameter, or verb post / put / patch</text>
<text class="c" x="560" y="518">application/json</text>
<rect class="wa" x="46" y="528" width="29" height="24" rx="12"/><text class="ta" x="60" y="544" text-anchor="middle" font-size="12" font-weight="600">4</text>
<text class="s" x="86" y="544">v3: data.consumes when set, else</text>
<text class="c" x="560" y="544">application/json</text>
<rect class="sunk dash" x="28" y="592" width="904" height="46" rx="13"/>
<text class="s" x="46" y="620">Body plus formData throws SWAGGER_BODY_FORM_CONFLICT. Two body parameters throw SWAGGER_BODY_PARAMETER_DUPLICATE.</text>
</svg>
