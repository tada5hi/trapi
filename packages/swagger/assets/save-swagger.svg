<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="sw-save-title sw-save-desc">
<title id="sw-save-title">saveSwagger writes one file per call</title>
<desc id="sw-save-desc">saveSwagger(spec, { cwd: './docs', name: 'openapi.json', format: 'yaml' }) replaces the .json suffix with .yaml, resolves ./docs against process.cwd() and creates it, serialises the spec with locter's YAMLWriter, writes the file and returns DocumentFormatData with the absolute path, the file name and the content. Defaults: cwd process.cwd(), name swagger, format json.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="sw-save-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="456" rx="22"/>
<text class="h" x="30" y="44">saveSwagger writes one file per call</text>
<rect class="sunk" x="28" y="70" width="250" height="268" rx="13"/>
<text class="l" x="46" y="94">your call</text>
<text class="c" x="46" y="122">saveSwagger(spec, {</text>
<text class="c" x="62" y="144">cwd: './docs',</text>
<text class="c" x="62" y="166">name: 'openapi.json',</text>
<text class="c" x="62" y="188">format: 'yaml',</text>
<text class="c" x="46" y="210">})</text>
<rect class="card" x="306" y="70" width="290" height="84" rx="13"/><rect class="ka" x="306" y="84" width="4" height="56" rx="2"/>
<text class="l" x="324" y="94">name</text>
<text class="c" x="324" y="118">'openapi.json' → 'openapi.yaml'</text>
<text class="s" x="324" y="140">.json, .yaml, .yml swapped for format</text>
<rect class="card" x="306" y="162" width="290" height="84" rx="13"/><rect class="ka" x="306" y="176" width="4" height="56" rx="2"/>
<text class="l" x="324" y="186">directory</text>
<text class="c" x="324" y="210">'./docs' → &lt;cwd&gt;/docs</text>
<text class="s" x="324" y="232">resolved, then created recursively</text>
<rect class="card" x="306" y="254" width="290" height="84" rx="13"/><rect class="ka" x="306" y="268" width="4" height="56" rx="2"/>
<text class="l" x="324" y="278">content</text>
<text class="c" x="324" y="302">new YAMLWriter().stringify()</text>
<text class="s" x="324" y="324">json: JSON.stringify(spec, null, 4)</text>
<path class="rail" d="M280 204 H297" marker-end="url(#sw-save-arrow)"/>
<rect class="card" x="624" y="70" width="308" height="268" rx="13"/><rect class="ks" x="624" y="84" width="4" height="240" rx="2"/>
<text class="t" x="642" y="102">returns DocumentFormatData</text>
<text class="c" x="642" y="126">{</text>
<text class="c" x="658" y="148">path: '/srv/docs/openapi.yaml',</text>
<text class="c" x="658" y="170">name: 'openapi.yaml',</text>
<text class="c" x="658" y="192">content: 'components:…'</text>
<text class="c" x="642" y="214">}</text>
<path class="rail" d="M598 204 H615" marker-end="url(#sw-save-arrow)"/>
<rect class="wa" x="28" y="354" width="201" height="24" rx="12"/><text class="c ta" x="128" y="370" text-anchor="middle" font-size="11" style="font-size:11px">default cwd: process.cwd()</text>
<rect class="wa" x="239" y="354" width="181" height="24" rx="12"/><text class="c ta" x="330" y="370" text-anchor="middle" font-size="11" style="font-size:11px">default name: 'swagger'</text>
<rect class="wa" x="430" y="354" width="174" height="24" rx="12"/><text class="c ta" x="517" y="370" text-anchor="middle" font-size="11" style="font-size:11px">default format: 'json'</text>
<rect class="sunk dash" x="28" y="398" width="904" height="46" rx="13"/>
<text class="s" x="46" y="426">One format per call: call it twice for JSON and YAML. It does not validate the document.</text>
</svg>
