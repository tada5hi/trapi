<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="sw-v2p-title sw-v2p-desc">
<title id="sw-v2p-title">Swagger 2.0 query, path and header parameters need an inline type</title>
<desc id="sw-v2p-desc">A query parameter role of the refEnum Role is dereferenced in Swagger 2.0 to type string with enum admin and user, while OpenAPI 3.x keeps a schema $ref to #/components/schemas/Role. A query parameter filter of a nested object literal type has no 2.0 representation and is floored to type string, while OpenAPI 3.x emits a schema of type object.</desc>
<style>
:root{--canvas:#f6f7fb;--panel:#ffffff;--sunk:#eceff6;--ink:#253447;--muted:#526278;--border:#c6cedc;--arrow:#71819a;
--accent:#6366d8;--second:#159cb2;--ok:#2e9d6e;--warn:#c9820f;--drop:#d0456a;
--accent-wash:#6366d81f;--second-wash:#159cb21f;--ok-wash:#2e9d6e1f;--warn-wash:#c9820f1f;--drop-wash:#d0456a1f}
@media(prefers-color-scheme:dark){:root{--canvas:#141c29;--panel:#1f2b3d;--sunk:#18222f;--ink:#edf2fa;--muted:#bbc8dc;--border:#43536d;--arrow:#a4b5d1;
--accent:#8f92f2;--second:#3dbdd2;--ok:#4cc391;--warn:#e0a23c;--drop:#ee7394;
--accent-wash:#8f92f226;--second-wash:#3dbdd226;--ok-wash:#4cc39126;--warn-wash:#e0a23c26;--drop-wash:#ee739426}}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink);font-size:14px}
.h{font-size:20px;font-weight:650}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:var(--muted)}
.l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.canvas{fill:var(--canvas);stroke:var(--border)}
.card{fill:var(--panel);stroke:var(--border)}
.sunk{fill:var(--sunk);stroke:var(--border)}
.rail{fill:none;stroke:var(--arrow);stroke-width:2}
.dash{stroke-dasharray:5 5}
.ka{fill:var(--accent)}.ks{fill:var(--second)}.ko{fill:var(--ok)}.kw{fill:var(--warn)}.kd{fill:var(--drop)}
.wa{fill:var(--accent-wash);stroke:var(--accent)}.ws{fill:var(--second-wash);stroke:var(--second)}.wo{fill:var(--ok-wash);stroke:var(--ok)}.ww{fill:var(--warn-wash);stroke:var(--warn)}.wd{fill:var(--drop-wash);stroke:var(--drop)}
.ta{fill:var(--accent)}.ts{fill:var(--second)}.to{fill:var(--ok)}.tw{fill:var(--warn)}.td{fill:var(--drop)}
</style>
<defs><marker id="sw-v2p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<rect class="canvas" x="8" y="8" width="944" height="470" rx="22"/>
<text class="h" x="30" y="44">Swagger 2.0 query, path and header parameters need an inline type</text>
<rect class="wa" x="90" y="72" width="155" height="24" rx="12"/><text class="ta" x="168" y="88" text-anchor="middle" font-size="12" font-weight="600">metadata parameter</text>
<rect class="ws" x="440" y="72" width="37" height="24" rx="12"/><text class="ts" x="459" y="88" text-anchor="middle" font-size="12" font-weight="600">v2</text>
<rect class="ws" x="701" y="72" width="140" height="24" rx="12"/><text class="ts" x="771" y="88" text-anchor="middle" font-size="12" font-weight="600">v3 · v3.1 · v3.2</text>
<rect class="sunk" x="28" y="108" width="280" height="138" rx="13"/>
<text class="c" x="46" y="140">{ name: 'role',</text>
<text class="c" x="62" y="162">in: 'queryProp',</text>
<text class="c" x="62" y="184">type: { typeName: 'refEnum',</text>
<text class="c" x="78" y="206">refName: 'Role' } }</text>
<rect class="card" x="324" y="108" width="270" height="138" rx="13"/><rect class="ks" x="324" y="122" width="4" height="110" rx="2"/>
<text class="c" x="342" y="140">{ "in": "query",</text>
<text class="c" x="358" y="162">"type": "string",</text>
<text class="c" x="358" y="184">"enum": ["admin", "user"] }</text>
<rect class="wo" x="342" y="210" width="111" height="24" rx="12"/><text class="to" x="398" y="226" text-anchor="middle" font-size="12" font-weight="600">dereferenced</text>
<rect class="card" x="610" y="108" width="322" height="138" rx="13"/><rect class="ks" x="610" y="122" width="4" height="110" rx="2"/>
<text class="c" x="628" y="140">{ "in": "query",</text>
<text class="c" x="644" y="162">"schema": { "$ref":</text>
<text class="c" x="660" y="184">"#/components/schemas/Role" } }</text>
<path class="rail" d="M310 177 H315" marker-end="url(#sw-v2p-arrow)"/>
<rect class="sunk" x="28" y="258" width="280" height="138" rx="13"/>
<text class="c" x="46" y="290">{ name: 'filter',</text>
<text class="c" x="62" y="312">in: 'queryProp',</text>
<text class="c" x="62" y="334">type: { typeName:</text>
<text class="c" x="78" y="356">'nestedObjectLiteral' } }</text>
<rect class="card" x="324" y="258" width="270" height="138" rx="13"/><rect class="ks" x="324" y="272" width="4" height="110" rx="2"/>
<text class="c" x="342" y="290">{ "in": "query",</text>
<text class="c" x="358" y="312"><tspan class="tw">"type": "string"</tspan> }</text>
<rect class="ww" x="342" y="360" width="148" height="24" rx="12"/><text class="tw" x="416" y="376" text-anchor="middle" font-size="12" font-weight="600">floored to string</text>
<rect class="card" x="610" y="258" width="322" height="138" rx="13"/><rect class="ks" x="610" y="272" width="4" height="110" rx="2"/>
<text class="c" x="628" y="290">{ "in": "query",</text>
<text class="c" x="644" y="312">"schema": {</text>
<text class="c" x="660" y="334">"type": "object" } }</text>
<path class="rail" d="M310 327 H315" marker-end="url(#sw-v2p-arrow)"/>
<rect class="sunk dash" x="28" y="410" width="904" height="62" rx="13"/>
<text class="s" x="46" y="432">A refAlias is followed to its target, keeping the alias format, default, description and validators.</text>
<text class="s" x="46" y="452">Objects, unions, any and cyclic aliases fall back to type: string. Body parameters keep their $ref.</text>
</svg>
